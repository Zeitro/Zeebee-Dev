name: Zeebee Backend Deploy to staging
#test out
on:
  push:
    branches: [ staging ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: remove old docker containers
        run: |
          docker rm -f backend-borrower-staging || true
      - name: build and deploy
        working-directory: backend
        run: |
          docker-compose -f docker-compose-borrower-staging.yml down || true
          docker-compose -f docker-compose-borrower-staging.yml build --no-cache
          docker-compose -f docker-compose-borrower-staging.yml up -d
      - name: remove dangling images
        run: |
          docker image prune -f