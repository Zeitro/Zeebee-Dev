name: Zeebee Backend Deploy to staging

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: build and deploy
        run: |
          docker-compose -f docker-compose-borrower-staging.yml down || true
          docker-compose -f docker-compose-borrower-staging.yml up --build -d