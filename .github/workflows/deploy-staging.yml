name: Zeebee Backend Deploy to staging

on:
  push:
    branches:
      - staging-borrower-backend
      - staging-lender-backend
    paths: [ '.github/workflows/**' ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Get Git Commit ID
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set environment variables
        id: set_env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/staging-borrower-backend" ]]; then
            echo "SERVICE_NAME=borrower" >> $GITHUB_ENV
            echo "IMAGE_NAME=staging-borrower-backend" >> $GITHUB_ENV
            echo "CONTAINER_NAME=backend-borrower-staging" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/staging-lender" ]]; then
            echo "SERVICE_NAME=lender" >> $GITHUB_ENV
            echo "IMAGE_NAME=staging-lender-backend" >> $GITHUB_ENV
            echo "CONTAINER_NAME=staging-lender-backend" >> $GITHUB_ENV
          fi

      - name: Show environment variables
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "SERVICE_NAME=${SERVICE_NAME}"
          echo "CONTAINER_NAME=${CONTAINER_NAME}"
          echo "IMAGE_NAME=${IMAGE_NAME}"

      - name: Remove old docker containers
        run: |
          docker rm -f ${CONTAINER_NAME} || true

      - name: Build and deploy
        working-directory: backend
        env:
          IMAGE_TAG: ${{ env.sha_short }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        run: |
          echo "Deploying service: ${CONTAINER_NAME}"
          docker-compose -f docker-compose-staging.yml down || true
          docker-compose -f docker-compose-staging.yml build --no-cache
          docker-compose -f docker-compose-staging.yml up -d

      - name: Remove old images
        run: |
          docker images ${IMAGE_NAME} \
            --format "{{.Tag}}" \
            | sort -V \
            | head -n -10 \
            | xargs -r -I {} docker rmi ${IMAGE_NAME}:{} || true

      - name: Remove dangling images
        run: |
          docker image prune -f