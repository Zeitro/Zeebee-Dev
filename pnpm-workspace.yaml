packages:
  - "frontend/borrower"
  - "frontend/lender"
  - "frontend/admin"
  - "frontend/project"
  - "frontend/packages/*"
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': set this to true or false
  es5-ext: true
  sharp: true
  unrs-resolver: true
overrides:
  react-pdf: 10.0.1
  pdfjs-dist: 5.3.31
