version: '3.8'

services:
  backend-borrower-staging:
    image: backend-borrower-staging:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile-borrower-staging
    container_name: backend-borrower-staging
    network_mode: host
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1         
        awslogs-group: /zeebee/borrower-staging
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}

