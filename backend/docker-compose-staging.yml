version: '3.8'

services:
  staging-borrower-backend:
    image: staging-borrower-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile-borrower-staging
    container_name: staging-borrower-backend
    network_mode: host
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1
        awslogs-group: /zeebee/borrower-staging
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}

  staging-lender-backend:
    image: staging-lender-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile-lender-staging
    container_name: staging-lender-backend
    network_mode: host
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1
        awslogs-group: /zeebee/lender-staging
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}

