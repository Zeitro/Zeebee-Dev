version: '3.8'

services:
  postgres_14_18:
    image: postgres:14.18
    container_name: postgres_14_18
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_db
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis_7_2:
    image: redis:7.2-alpine
    container_name: redis_7_2
    ports:
      - "6379:6379"
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-borrower-dev:
    image: backend-borrower-dev
    build:
      context: .
      dockerfile: Dockerfile-borrower-dev
      no_cache: true
    container_name: backend-borrower-dev
    ports:
      - "11000:10000"
    depends_on:
      postgres_14_18:
        condition: service_healthy
      redis_7_2:
        condition: service_healthy
    networks:
      - shared_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  shared_network:
    driver: bridge