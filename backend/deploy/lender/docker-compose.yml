services:
  staging-lender-backend:
    image: staging-lender-backend:${IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: deploy/lender/Dockerfile
      args:
        - CONFIG_ENV=staging
    container_name: staging-lender-backend
    network_mode: host
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1
        awslogs-group: /zeebee/lender-staging
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}

  prod-lender-backend:
    image: prod-lender-backend:${IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: deploy/lender/Dockerfile
      args:
        - CONFIG_ENV=production
    container_name: prod-lender-backend
    network_mode: host
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1
        awslogs-group: /zeebee/lender-production
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}

