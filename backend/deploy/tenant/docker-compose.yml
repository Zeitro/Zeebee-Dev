services:
  tenant-backend:
    image: ${FULL_SERVICE_NAME}:${IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: deploy/tenant/Dockerfile
      args:
        - CONFIG_ENV=${SERVICE_ENVIRONMENT}
    container_name: ${FULL_SERVICE_NAME}
    network_mode: host
    healthcheck:
      test: ["CMD", "/grpc_health_probe", "-addr=localhost:10401"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1
        awslogs-group: /zeebee/${SERVICE_NAME}-${SERVICE_ENVIRONMENT}
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}
