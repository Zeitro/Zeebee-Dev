version: '3.8'

services:
  prod-borrower-backend:
    image: prod-borrower-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile-borrower-production
    container_name: prod-borrower-backend
    network_mode: host
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1
        awslogs-group: /zeebee/borrower-production
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}

  prod-lender-backend:
    image: prod-lender-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile-lender-production
    container_name: prod-lender-backend
    network_mode: host
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1
        awslogs-group: /zeebee/lender-production
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}
