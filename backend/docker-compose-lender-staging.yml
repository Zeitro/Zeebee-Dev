version: '3.8'

services:
  backend-lender-staging:
    image: backend-lender-staging:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile-lender-staging
    container_name: backend-lender-staging
    network_mode: host
    logging:
      driver: awslogs
      options:
        awslogs-region: us-west-1
        awslogs-group: /zeebee/lender-staging
        awslogs-create-group: "true"
        awslogs-stream: backend-${HOSTNAME}