  string source_template_name = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ProjectManagementWorkflowStageEntity {
  int64 id = 1;
  string name = 2;
  string phase = 3;
  string color = 4;
  int32 sort_order = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated ProjectManagementWorkflowTransitionEntity transitions = 8;
}

message ProjectManagementWorkflowTransitionEntity {
  int64 id = 1;
  int64 from_stage_id = 2;
  int64 to_stage_id = 3;
  repeated string allowed_actor_types = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ProjectManagementTaskTypeEntity {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string color = 4;
  string created_at = 6;
  string updated_at = 7;
  int64 sort_order = 8;
}

message ProjectManagementProjectEntity {
  int64 id = 1;
  int64 entity_id = 2;
  string name = 3;
  string description = 4;
  string cover_url = 5;
  int64 owner_id = 6;
  string entity_type = 7;
  string owner_name = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ProjectManagementMemberEntity {
  int64 id = 1;
  int64 project_id = 2;
  int64 organization_user_id = 3;
  string role = 4;
  string full_name = 5;
  string email = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ProjectManagementTaskTypeSnapshotEntity {
  int64 id = 1;
