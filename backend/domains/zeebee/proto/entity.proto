syntax = "proto3";

package proto;
option go_package = "zeebee-backend/domains/zeebee/proto";

import "proto/common.proto";

message AddressEntity{
  string state = 1;
  string city = 2;
  string address1 = 3;
  string address2 = 4;
  string zip_code = 5;
}

// User Entity
message UserEntity {
  int64 id = 1;
  string email = 2;
  string status = 3;
  string type = 4;
  string first_name = 5;
  string mid_name = 6;
  string last_name = 7;
  string full_name = 8;
  int64 default_organization_id = 9;
  string created_at = 10;
  string updated_at = 11;
  string pivot_organization_status = 12;
  repeated RoleEntity roles = 13;
}

// Organization Entity
message OrganizationEntity {
  int64 id = 1;
  string name = 2;
  string status = 3;
  AddressEntity address = 4;
  string contact_email = 5;
  string contact_phone = 6;
  string contact_name = 7;
  string owner_type = 8;
  string type = 9;
  string logo = 10;
  string website = 11;
  string tagline = 12;
  OrganizationMetadataEntity metadata = 13;
  string created_at = 14;
  string updated_at = 15;
  repeated OrganizationEmailEntity organization_emails = 16;
  UserEntity owner = 17;
  string source = 18;
  int32 order = 19;
  int64 owner_id = 20;
  bool is_editable = 21;
  repeated OrganizationSettingEntity organization_settings = 22;
}

message OrganizationOptionsEntity {
  int64 id = 1;
  string name = 2;
  string contact_email = 3;
  string type = 4;
}

message OrganizationMetadataEntity {
  OrganizationLenderMetadataEntity lender = 1;
}
message OrganizationLenderMetadataEntity {
  RangeFloat loan_amount_range = 1;
  RangeInt32 loan_term_range = 2;
  RangeFloat loan_rate_range = 3;
  RangeFloat loan_point_range = 4;
}

message OrganizationProfileEntity {
  int64 id = 1;
  string name = 2;
  string status = 3;
  int64 owner_id = 4;
  AddressEntity address = 5;
  string contact_email = 6;
  string contact_phone = 7;
  string contact_name = 8;
  string owner_type = 9;
  string type = 10;
  string created_at = 11;
  string updated_at = 12;
  repeated OrganizationEmailEntity organization_emails = 13;
  string logo = 14;
  string website = 15;
  string tagline = 16;
  OrganizationMetadataEntity metadata = 17;
  UserEntity owner = 18;
  bool is_editable = 19;
  repeated OrganizationSettingProfileEntity organization_settings = 20;
  string source = 21;
  int32 order = 22;
}

// Organization User Entity
message OrganizationUserEntity {
  int64 id = 1;
  int64 organization_id = 2;
  int64 user_id = 3;
  string status = 4;
  string first_name = 5;
  string mid_name = 6;
  string last_name = 7;
  string full_name = 8;
  string phone = 9;
  string remark = 10;
  string created_at = 11;
  string updated_at = 12;
  string email = 13;
  repeated RoleEntity roles = 14;
}

// Organization Email Entity
message OrganizationEmailEntity {
  int64 id = 1;
  int64 organization_id = 2;
  string email = 3;
  string auth_strategy = 4;
  string purpose = 5;
  bool is_authorized = 6;
}

// Organization Setting Entity
message OrganizationSettingEntity {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  bool enabled = 4;
  bytes setting = 5;
  string purpose = 6;
}

message OrganizationSettingProfileEntity {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  bool enabled = 4;
  bytes setting = 5;
  string purpose = 6;
  bool has_configured = 7;
}

// Organization Template Entity
message OrganizationTemplateEntity {
  int64 id = 1;
  string name = 2;
  string type = 3;           // Borrower, Lender
  string category = 4;       // Email, Contract
  string purpose = 5;
  string content = 6;
  repeated TemplateVariableGroupEntity variable_group_schema = 7;
  string status = 8;         // Active, Disabled
  string description = 9;
  string created_at = 10;
  string updated_at = 11;
  string example_variables = 12;
  bool has_configured = 13;
}

// Role Entity
message RoleEntity {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
  int64 organization_id = 8;
  repeated ResourceEntity resources = 9;
  repeated OrganizationUserEntity organization_users = 10;
}

// Resource Entity
message ResourceEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string resource_type = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  string tag = 8;
  bool is_show = 9;
  string status = 10;
  int32  sort_order = 11;
  string created_at = 12;
  string updated_at = 13;
  repeated ApiEntity apis = 14;
  string data_scope = 15;
  bool enable_data_scope = 16;
  string description = 17;
  bool is_public = 18;
}

message ResourceTreeEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string resource_type = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  string tag = 8;
  bool is_show = 9;
  string status = 10;
  int32  sort_order = 11;
  string created_at = 12;
  string updated_at = 13;
  repeated ResourceTreeEntity children = 14;
  bool enable_data_scope = 15;
  repeated ApiEntity apis = 16;
  string description = 17;
  bool is_public = 18;
}

// Api Entity
message ApiEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  string path = 4;
  string method = 5;
  string status = 6;
  string description = 7;
  string type = 8;
  int32  sort_order = 9;
  string created_at = 10;
  string updated_at = 11;
  bool auth_required = 13;
  bool permission_required = 14;
}

message ApiTreeEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  string path = 4;
  string method = 5;
  string status = 6;
  string description = 7;
  string type = 8;
  int32  sort_order = 9;
  string created_at = 10;
  string updated_at = 11;
  repeated ApiTreeEntity children = 12;
  bool auth_required = 13;
  bool permission_required = 14;
}

// Option  Entity
message OptionEntity{
  string label = 1;
  string value = 2;
}

// Base Template Entity
message TemplateVariableEntity {
  string label = 1;
  string type = 2;           // String, Array, Object
  string key = 3;
  bool is_editable = 4;
  string source = 5;         // Fixed, Dynamic,Template
  string fixed_value = 6;
  map<string, TemplateVariableEntity> properties = 8;  // for Object type
  repeated TemplateVariableEntity items = 9;            // for Array type
  string format = 10;
  bool is_required = 11;
}

// Template variable group entity
message TemplateVariableGroupEntity {
  string name = 1;
  repeated TemplateVariableEntity variables = 2;
}

// Base template entity
message BaseTemplateEntity {
  int64 id = 1;
  string name = 2;
  string type = 3;           // Borrower, Lender
  string category = 4;       // Email, Contract
  string purpose = 5;
  string content = 6;
  repeated TemplateVariableGroupEntity variable_group_schema = 7;
  string status = 8;         // Active, Disabled
  string description = 9;
  string created_at = 10;
  string updated_at = 11;
  string example_variables = 12;
  string scope = 13; // System, Organization
  bool is_configurable = 14;
}

// Loan Entity
message LoanEntity {
  int64 id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntity loan_property = 8;
  string lender_company = 9;
  string closing_date = 10;
  double holdback_amount = 11;
  double holdback_released_amount = 12;
  float rate = 13;
  double closing_fund = 14;
  double principal_amount = 15;
  double monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  int32 prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  string created_at = 22;
  string updated_at = 23;
  int64 lender_organization_id = 24;
  int64 borrower_organization_id = 25;
  repeated string business_strategy = 26;
  repeated LoanApplicantEntity applicants = 27;
  string source = 28;
  int32 loan_term = 29;
  double ltv = 30;
  int32 est_credit_score = 31;
  double reserves_amount = 32;
  repeated LoanExperienceEntity transaction_experiences = 33;
  repeated LoanExperienceEntity real_estate_experiences = 34;
  LoanBorrowerEntity loan_borrower = 35;
  LoanDemographicEntity loan_demographic = 36;
  repeated LoanThirdServiceEntity loan_third_services = 37;
  string original_contract_date = 38;
  string extension_date = 39;
  string loan_processor = 40;
  LoanExtendValueEntity extend = 41;
  repeated LoanDocumentEntity loan_documents = 42;
  string code = 43;

  int64 creator_id = 44;
  int64 RequestedLoanDocumentCount = 45;
  string creator_name = 46;

  double HoldbackRemainingAmount = 47;
  string due_status = 48;
  int32 due_days = 49;
  BorrowerPropertyTransactionEntity borrower_property_transaction = 50;
}

message  LoanBudgetEntity {
  double original_budget = 1;
  double remaining_budget = 2;
  double cost_spent_to_date_amount = 3;
}

message LoanExtendValueEntity {
  string  pricing = 1;
  string loan_status_updates = 2;
  string meeting_notes = 3;
  string action_list = 4;
  string business_line = 5;
}

// Loan Property Entity
message LoanPropertyEntity{
  int64 id = 1;
  string property_type = 2 ;
  BorrowerPropertyEntity borrower_property = 3;
  float living_area_sqft = 5;
  int32 bedrooms = 6;
  int32 bathrooms = 7;
  string future_property_type = 8;
  int32  future_unit = 9;
  float future_living_area_sqft = 10;
  int32 future_bedrooms = 11;
  int32 future_bathrooms = 12;
  string owner = 13;
  int32 unit = 14;
  //
  string existing_lender_company = 15;
  float existing_rate = 16;
  string existing_maturity_date = 17;
  double purchase_amount = 18;
  string purchase_date = 19;
  bool has_assignment_fee = 20;
  double assignment_fee_amount = 21;
  bool has_subordinate_debt = 22;
  double subordinate_debt_amount = 23;
  string scheduled_close_escrow_date = 24;
  double liquidity_amount = 25;
  LoanBudgetEntity budget = 26;
  bool mid_construction = 27;
  double est_yearly_rental_income_amount = 28;
  double yearly_liability_expense_amount = 29;
  double dscr = 30;
  bool has_delayed_financing = 31;
  bool has_collateralized_blanket = 32;
  bool has_properties_vacant = 33;
  bool has_short_term_rental = 34;
  double est_property_value_amount = 35;
  AddressEntity address = 36;
  double arv = 37;

  int64 borrower_property_id = 38;
  float lot_area_sqft = 39;
}

// Borrower Property Entity
message BorrowerPropertyEntity{
  int64 id = 1;
  string property_type = 2;
  double total_amount = 3;
  int32  unit = 4;
  float living_area_sqft = 5;
  int32 bedrooms = 6;
  int32 bathrooms = 7;
  AddressEntity address = 8;
  string created_at = 9;
  string updated_at = 10;
  int32 loan_count = 11;
  int64 creator_id = 12;
  int64 organization_id = 13;
  string creator_name = 14;
  float lot_area_sqft = 15;
  repeated string status = 16;
}

// Borrower Applicant  Entity
message BorrowerApplicantEntity {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  int64 creator_id = 4;
  string first_name = 5;
  string mid_name = 6;
  string last_name = 7;
  string full_name = 8;
  string ssn = 9;
  string dob = 10;
  string marital_status = 11;
  string email = 12;
  int32 est_credit_score = 13;
  string driver_license_num = 14;
  AddressEntity address = 15;
  string phone = 16;
  int64 organization_id = 17;
  string creator_name = 18;
}

// Borrower Entity Entity
message BorrowerEntityEntity {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  int64 creator_id = 4;
  string type = 5;
  string name = 6;
  string tin_type = 7;
  string tin = 8;
  AddressEntity mailing_address = 9;
  string contact_email = 10;
  string contact_name = 11;
  string contact_phone = 12;
  int64 organization_id = 13;
  string creator_name = 14;
}

// Borrower Property Transaction Entity
message BorrowerPropertyTransactionEntity {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  int64 borrower_property_id = 4;
  int64 organization_id = 5;
  string code = 6;
  string type = 7;
  string status = 8;
  string coe_date = 9;
  double purchase_amount = 10;
  double emd_amount = 11;
  string property_type = 12;
  string pm = 13;
  repeated string business_strategy = 14;
  string note = 15;
  BorrowerPropertyTransactionChecklistEntity checklist = 16;
  string title_holder = 17;
  string contract_date = 18;
  string emd_due_date = 19;
  string contingency_removal_date = 20;
  string tc = 21;
  string cost_allocation = 22;
  repeated PropertyTransactionEscrowEntity escrows = 23;
  BorrowerPropertyEntity borrower_property = 24;
  PropertyTransactionPropertyEntity property = 25;
}
// Property Transaction Escrow Entity
message PropertyTransactionEscrowEntity {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  int64 borrower_property_transaction_id = 4;
  string no = 5;
  string escrow_company = 6;
  string officer_name = 7;
  string officer_phone = 8;
  string officer_email = 9;
  PropertyTransactionEscrowChecklistEntity checklist = 10;
}
// Property Transaction Property Entity
message PropertyTransactionPropertyEntity {
  int64 id = 1;
  string created_at = 2;
  string updated_at = 3;
  int64 borrower_property_transaction_id = 4;
  int64 borrower_property_id = 5;
  int32 unit = 6;
  string property_type = 7;
  float living_area_sqft = 8;
  float lot_area_sqft = 9;
  int32 bedrooms = 10;
  int32 bathrooms = 11;
  AddressEntity address = 12;
}

message PropertyTransactionEscrowChecklistEntity {
  bool has_wire_instruction = 1;
  bool has_emd_receipt = 2;
  bool has_prelim_report = 3;
  bool has_nhd = 4;
  bool has_colored_map = 5;
}

message BorrowerPropertyTransactionChecklistEntity {
  bool all_checked = 1;
  int32 total_document_count = 2;
  int32 total_required_document_count = 3;
  int32 total_required_uploaded_document_count = 4;
  int32 total_optional_document_count = 5;
  int32 total_optional_uploaded_document_count = 6;
  repeated BorrowerPropertyTransactionChecklistNodeEntity required_documents = 7;
  repeated BorrowerPropertyTransactionChecklistNodeEntity optional_documents = 8;
}

message BorrowerPropertyTransactionChecklistNodeEntity {
  string name = 1;
  int64 document_id = 2;
  bool is_required = 3;
  int32 sub_document_count = 4;
  int32 uploaded_document_count = 5;
  repeated BorrowerPropertyTransactionChecklistNodeEntity children = 6;
  int32 file_count = 7;
  repeated FileEntity files = 8;
  int32 required_document_count = 9;
  int32 optional_document_count = 10;
  FileParseConfig file_parse_config = 11;
  repeated string tags = 12;
}

message FileParseConfig {
  repeated FileParseRule rules = 1;
}

message FileParseRule {
  string parser = 1;
  string source = 2;            // SingleFile | Files | Directory | TagFiltered
  string triggered_by = 3;      // Upload | Manual
  string label = 4;             // button label
  TagSelector selector = 5;     // TagFiltered only
}

message TagSelector {
  repeated string tags = 1;          // AND semantics
}

message BorrowerPropertyTransactionOptionEntity {
  int64 id = 1;
  string code = 2;
  string type = 3;
  string status = 4;
  string property_type = 5;
  int64 borrower_property_id = 6;
  BorrowerPropertyEntity borrower_property = 7;
  string coe_date = 8;
}


// Loan Applicant Entity
message LoanApplicantEntity{
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  bool is_primary = 4;
  string created_at = 5;
  string updated_at = 6;
  string mid_name = 7;
  string type = 8;
  string invitation_status = 9;
  string full_name = 10;
  int64  loan_property_id = 11;
  string ssn = 12;
  string dob = 13;
  string marital_status = 14;
  string email = 15;
  int32 est_credit_score = 16;
  string driver_license_num = 17;
  AddressEntity address = 18;
  int64  loan_borrower_id = 19;
  string phone = 20;
  int32 own_percent = 21;
  int64 borrower_applicant_id = 22;
  int64 loan_id = 23;
  int64 borrower_id = 24;
  int64 user_id = 25;
  int64 organization_id = 26;
}

// Loan Experience Entity
message LoanExperienceEntity{
  int64 id = 1;
  int64 loan_id = 2;
  string city = 3 [deprecated = true];
  string state = 4 [deprecated = true];
  string ownership_on_title = 5;
  string property_type = 6;
  double purchase_amount = 7;
  string purchase_date = 8;
  double sold_amount = 9;
  string sold_date = 10;
  double budget_or_cost = 11;
  double profit = 12;
  bool is_tenant_occupied = 13;
  string type = 14;
  AddressEntity address = 15;
}

// Loan Demographic Entity
message LoanDemographicEntity{
  int64 id = 1;
  int64 loan_id = 2;
  LoanDemographicPropertyEntity property = 3;
  LoanDemographicEthnicityEntity ethnicity = 4;
  LoanDemographicRaceEntity race = 5;
  string sex = 6;
}

message LoanDemographicPropertyEntity {
  bool as_primary_resident = 1;
  bool has_transaction_relationship = 2;
  bool has_borrowed_money = 3;
  double borrowed_money_amount = 4;
  bool has_another_mortgage_loan = 5;
  bool has_priority_over1st = 6;
  bool has_outstanding_judgments = 7;
  bool has_federal_debt = 8;
  bool has_a_lawsuit = 9;
  bool has_conveyed_title = 10;
  bool has_a_pre_foreclosure_sale = 11;
  bool has_foreclosed_upon = 12;
  bool has_a_bankruptcy = 13;
  string bankruptcy_chapter = 14;
}

message LoanDemographicEthnicityEntity {
  repeated string values = 1;
  string other_hispanic_or_latino_name = 2;

}

message LoanDemographicRaceEntity {
  repeated string values = 1;
  repeated string asian_values = 2;
  string american_indian_or_alaska_native_name = 3;
  string asian_other_name = 4;
  string other_pacific_islander_name = 5;
}

message LoanDemographicExtraDemographicEntity {
  bool is_ethnicity_collected_by_observation = 1;
  bool is_sex_collected_by_observation = 2;
  bool is_race_collected_by_observation = 3;
  repeated string info_channels = 4;
}

// Loan Borrower Entity
message LoanBorrowerEntity{
  int64 id = 1;
  int64 loan_id = 2;
  string type = 3;
  string name = 4;
  string tin_type = 5;
  string tin = 6;
  AddressEntity mailing_address = 7;
  string contact_email = 8;
  string contact_phone = 9;
  string contact_name = 10;
  int32 own_percent = 11;
  int64 borrower_entity_id = 12;
  string created_at = 13;
  string updated_at = 14;
}

// Loan Document Entity
message LoanDocumentEntity {
  int64 id = 1;
  int64 loan_id = 2;
  string category = 3;
  string file_type = 4;
  string comment = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
  repeated FileEntity files = 9;
  string LastUploadedAt = 10;
}
message LoanDocumentOptEntity {
  int64 id = 1;
  string file_type = 2;
  string category = 3;
}

// File Entity
message FileEntity {
  int64 id = 1;
  string entity_type = 2;
  int64 entity_id = 3;
  string file_url = 4;
  string created_at = 5;
  string updated_at = 6;
  string file_name = 7;
  string storage_type = 8;
  string external_id = 9;
  string upload_type = 10;
  string drive_url = 11;
  string drive_synced_at = 12;
}

// Loan Third Service Entity
message LoanThirdServiceEntity{
  int64 id = 1;
  int64 loan_id = 2;
  string type = 3;
  string name = 4;
  string email = 5;
  string phone = 6;
  string company = 7;
}

