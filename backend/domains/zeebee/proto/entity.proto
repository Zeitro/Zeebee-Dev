message PricingPlanEntity {
  int64 id = 1;
  string name = 2;
  string subtitle = 3;
  string description = 4;
  string status = 5;
  int32 trial_days = 6;
  int32 sort_order = 7;
  bool is_public = 8;
  string type = 9;
  string plan_type = 10;
  string created_at = 11;
  string updated_at = 12;
