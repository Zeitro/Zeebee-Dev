  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string name = 4;
  int32 level = 5;
  int32 sort_order = 6;
  string last_uploaded_at = 7;
  string metadata = 8;
  string created_at = 9;
  string updated_at = 10;
  repeated DocumentEntity children = 11;
  repeated FileEntity files = 12;
}

// Project management entities
message ProjectManagementWorkflowEntity {
  int64 id = 1;
  string name = 2;
  string description = 3;
  reserved 4;
  bool is_default = 5;
  repeated ProjectManagementWorkflowStageEntity stages = 6;
  repeated ProjectManagementWorkflowTransitionEntity transitions = 7;
