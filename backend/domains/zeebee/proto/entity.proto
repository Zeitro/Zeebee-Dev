// Email Authorization Entity
message EmailAuthorizationEntity {
  int64 id = 1;
  int64 organization_email_id = 2;
  int64 user_id = 3;
  string auth_strategy = 4;
  string email = 5;
  string email_provider = 6;
  bool is_authorized = 7;
