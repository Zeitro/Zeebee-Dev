syntax = "proto3";

package proto;
option go_package = "zeebee-backend/domains/zeebee/proto";

message EmptyRequest {}

message EmptyResponse {}

message StringSliceResponse {
  repeated string data = 1;
}

message IdRequest {
  int64 data = 1;
}

message PathIdRequest {
  PathIdRequestData data = 1;
}
message PathIdRequestData {
  int64 id = 1;
}

message RangeInt64 {
  int64 min = 1;
  int64 max = 2;
}

message RangeInt32 {
  int32 min = 1;
  int32 max = 2;
}

message RangeFloat {
  double min = 1;
  double max = 2;
}