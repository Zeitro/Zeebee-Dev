syntax = "proto3";

package proto;
option go_package = "zeebee-backend/domains/zeebee/proto";

message EmptyRequest {}

message EmptyResponse {}

message StringSliceResponse {
  repeated string data = 1;
}

message IdRequest {
  int64 data = 1;
}

message PathIdRequest {
  PathIdRequestData data = 1;
}
message PathIdRequestData {
  int64 id = 1;
}


// Page
message CommonPageRequest {
  CommonPageRequestData data = 1;
}

message CommonPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  CommonPageFilter filter = 3;
  CommonPageSorter sorter = 4;
}

message CommonPageFilter {
  string keyword = 1;
}

message CommonPageSorter {
  string column = 1;
  string sort = 2;
}

// Storage
message StorageCreatePresignedUrlRequest {
  StorageCreatePresignedUrlRequestData data = 1;
}

message StorageCreatePresignedUrlRequestData {
  string type = 1;
  string file_suffix = 2;
  string file_name = 3;
}

message StorageCreatePresignedUrlResponse {
  StorageCreatePresignedUrlResponseData data = 1;
}

message StorageCreatePresignedUrlResponseData {
  string url = 1;
  string file_name = 2;
  string storage_type = 3;
  string external_id = 4;
  string upload_type = 5;
}


message RangeInt64 {
  int64 min = 1;
  int64 max = 2;
}

message RangeInt32 {
  int32 min = 1;
  int32 max = 2;
}

message RangeFloat {
  double min = 1;
  double max = 2;
}
