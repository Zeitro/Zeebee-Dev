# golangci.yaml - 配置文件 for golangci-lint v2

# 版本声明（v2 使用 version: 2）
version: 2

# 运行时设置
run:
  timeout: 5m
  concurrency: 2
  tests: true
  fix: true

# Linter 配置
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - cyclop
    - gocritic
    - gosec
    - ineffassign
    - misspell
    - prealloc
    - unconvert
    - unparam
    - whitespace

  # Linter 的详细设置
  settings:
    gofmt:
      simplify: true

    goimports:

    revive:
      rules:
        - name: var-naming
          exclude: [ "" ]
          arguments:
            - ^[A-Z][a-zA-Z0-9]*$
            - ^[a-z][a-zA-Z0-9]*$

    cyclop:
      max-complexity: 30
      package-average: 10.0

    gosec:
      excludes:
        - G107
        - G101
        - G115 # int→int32 narrowing on bounded counts (len/sortOrder/stage totals); go-zero proto-int32 pattern, false positive at this scale

    whitespace:
      multi-if: true
      multi-func: true

    misspell:
      corrections:
        - from: "hte"
          to: "the"
        - from: "adn"
          to: "and"
        - from: "si"
          to: "is"
        - from: "teh"
          to: "the"

    unparam:
      check-exported: false

    staticcheck:
      checks: [ "all", "-SA5008","-ST1003","-ST1000" ]

# 问题过滤与排除
issues:
  exclude-rules:
    - path: '.*_test\.go'
      linters:
        - errcheck
        - maligned

    - linters:
        - staticcheck
      text: "SA5008"

  exclude-dirs:
    - vendor
    - docs
    - examples

  max-issues-per-linter: 50
  max-same-issues: 10

# 输出格式
output:
  format: colored-line-number
