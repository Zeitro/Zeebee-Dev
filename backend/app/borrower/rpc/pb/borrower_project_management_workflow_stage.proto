syntax = "proto3";

package borrower;

option go_package = "zeebee-backend/app/borrower/rpc/pb/borrower";

import "proto/common.proto";
import "proto/entity.proto";

message ProjectManagementWorkflowStageAllRequest {
  ProjectManagementWorkflowStageAllRequestData data = 1;
}
message ProjectManagementWorkflowStageAllRequestData {
  int64 workflow_id = 1;
}
message ProjectManagementWorkflowStageAllResponse {
  repeated proto.ProjectManagementWorkflowStageEntity data = 1;
}

message ProjectManagementWorkflowStageCreateRequest {
  ProjectManagementWorkflowStageCreateRequestData data = 1;
}
message ProjectManagementWorkflowStageCreateRequestData {
  int64 workflow_id = 1;
  string name = 2;
  string phase = 3;
  string color = 4;
  int64 sort_order = 5;
}

message ProjectManagementWorkflowStageUpdateRequest {
  ProjectManagementWorkflowStageUpdateRequestData data = 1;
}
message ProjectManagementWorkflowStageUpdateRequestData {
  int64 workflow_id = 1;
  int64 id = 2;
  string name = 3;
  string phase = 4;
  string color = 5;
  int64 sort_order = 6;
}

message ProjectManagementWorkflowStageDetailRequest {
  ProjectManagementWorkflowStageDetailRequestData data = 1;
}
message ProjectManagementWorkflowStageDetailRequestData {
  int64 workflow_id = 1;
  int64 id = 2;
}

message ProjectManagementWorkflowStageDetailResponse {
  proto.ProjectManagementWorkflowStageEntity data = 1;
}

service ProjectManagementWorkflowStage {
  rpc All(ProjectManagementWorkflowStageAllRequest) returns(ProjectManagementWorkflowStageAllResponse);
  rpc Detail(ProjectManagementWorkflowStageDetailRequest) returns(ProjectManagementWorkflowStageDetailResponse);
  rpc Create(ProjectManagementWorkflowStageCreateRequest) returns(ProjectManagementWorkflowStageDetailResponse);
  rpc Update(ProjectManagementWorkflowStageUpdateRequest) returns(ProjectManagementWorkflowStageDetailResponse);
  rpc Delete(ProjectManagementWorkflowStageDetailRequest) returns(proto.EmptyResponse);
}
