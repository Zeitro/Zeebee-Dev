syntax = "proto3";

package borrower;

option go_package = "zeebee-backend/app/borrower/rpc/pb/borrower";

import "proto/common.proto";
import "proto/entity.proto";

message ProjectManagementWorkflowAllRequest {
  ProjectManagementWorkflowAllRequestData data = 1;
}
message ProjectManagementWorkflowAllRequestData {
  string entity_type = 1;
  int64 entity_id = 2;
}
message ProjectManagementWorkflowAllResponse {
  repeated proto.ProjectManagementWorkflowEntity data = 1;
}

message ProjectManagementWorkflowDetailRequest {
  ProjectManagementWorkflowDetailRequestData data = 1;
}
message ProjectManagementWorkflowDetailRequestData {
  int64 id = 1;
  int64 project_id = 2;
}
message ProjectManagementWorkflowDetailResponse {
  proto.ProjectManagementWorkflowEntity data = 1;
}

message ProjectManagementWorkflowCreateRequest {
  ProjectManagementWorkflowCreateRequestData data = 1;
}
message ProjectManagementWorkflowStageInput {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string phase = 4;
  string color = 5;
  int32 sort_order = 6;
}
message ProjectManagementWorkflowTransitionInput {
  int64 id = 1;
  string name = 2;
  int64 from_stage_id = 3;
  int64 to_stage_id = 4;
  repeated string allowed_actor_types = 5;
}
message ProjectManagementWorkflowCreateRequestData {
  string name = 1;
  string description = 2;
  reserved 3;
  bool is_default = 4;
  repeated ProjectManagementWorkflowStageInput stages = 5;
  repeated ProjectManagementWorkflowTransitionInput transitions = 6;
  string entity_type = 7;
  int64 entity_id = 8;
}

message ProjectManagementWorkflowUpdateRequest {
  ProjectManagementWorkflowUpdateRequestData data = 1;
}
message ProjectManagementWorkflowUpdateStage {
  int64 id = 1;
  string name = 2;
  string phase = 3;
  string color = 4;
  int32 sort_order = 5;
  repeated ProjectManagementWorkflowUpdateTransition transitions = 6;
  string description = 7;
}
message ProjectManagementWorkflowUpdateTransition {
  int64 id = 1;
  string name = 2;
  int64 from_stage_id = 3;
  int64 to_stage_id = 4;
  repeated string allowed_actor_types = 5;
}
message ProjectManagementWorkflowUpdateRequestData {
  int64 id = 1;
  string name = 2;
  string description = 3;
  reserved 4, 5, 7;
  repeated ProjectManagementWorkflowUpdateStage stages = 6;
  int64 project_id = 8;
}

message ProjectManagementProjectWorkflowPageRequest {
  ProjectManagementProjectWorkflowPageRequestData data = 1;
}
message ProjectManagementProjectWorkflowPageFilter {
  int64 project_id = 1;
}
message ProjectManagementProjectWorkflowPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  ProjectManagementProjectWorkflowPageFilter filter = 3;
}
message ProjectManagementWorkflowPageResponse {
  int64 total = 1;
  int64 page = 2;
  int64 limit = 3;
  int64 total_page = 4;
  repeated proto.ProjectManagementWorkflowEntity list = 5;
}

message ProjectManagementProjectWorkflowBatchRequest {
  ProjectManagementProjectWorkflowBatchRequestData data = 1;
}
message ProjectManagementProjectWorkflowBatchRequestData {
  int64 project_id = 1;
  repeated int64 source_workflow_ids = 2;
}
message ProjectManagementProjectWorkflowCreateRequest {
  ProjectManagementProjectWorkflowCreateRequestData data = 1;
}
message ProjectManagementProjectWorkflowCreateRequestData {
  int64 project_id = 1;
  string name = 2;
  string description = 3;
}
message ProjectManagementProjectWorkflowUpdateRequest {
  ProjectManagementProjectWorkflowUpdateRequestData data = 1;
}
message ProjectManagementProjectWorkflowUpdateRequestData {
  int64 project_id = 1;
  int64 workflow_id = 2;
  repeated ProjectManagementWorkflowTransitionInput transitions = 3;
}
message ProjectManagementProjectWorkflowDetailRequest {
  ProjectManagementProjectWorkflowDetailRequestData data = 1;
}
message ProjectManagementProjectWorkflowDetailRequestData {
  int64 project_id = 1;
  int64 workflow_id = 2;
}
message ProjectManagementProjectWorkflowDeleteRequest {
  ProjectManagementProjectWorkflowDeleteRequestData data = 1;
}
message ProjectManagementProjectWorkflowDeleteRequestData {
  int64 project_id = 1;
  int64 workflow_id = 2;
}
message ProjectManagementWorkflowBatchResponse {
  repeated proto.ProjectManagementWorkflowEntity list = 1;
}

message ProjectManagementProjectWorkflowStageUpdateRequest {
  ProjectManagementProjectWorkflowStageUpdateRequestData data = 1;
}
message ProjectManagementProjectWorkflowStageUpdateRequestData {
  int64 project_id = 1;
  int64 workflow_id = 2;
  repeated ProjectManagementWorkflowUpdateStage stages = 3;
}

message ProjectManagementProjectWorkflowDefaultRequest {
  ProjectManagementProjectWorkflowDefaultRequestData data = 1;
}
message ProjectManagementProjectWorkflowDefaultRequestData {
  int64 project_id = 1;
  int64 workflow_id = 2;
}

message ProjectManagementWorkflowTemplateResponse {
  repeated proto.ProjectManagementTemplateEntity list = 1;
}

service ProjectManagementWorkflow {
  rpc All(ProjectManagementWorkflowAllRequest) returns(ProjectManagementWorkflowAllResponse);
  rpc Detail(ProjectManagementWorkflowDetailRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc Create(ProjectManagementWorkflowCreateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc Update(ProjectManagementWorkflowUpdateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc Default(proto.PathIdRequest) returns(proto.EmptyResponse);
  rpc Delete(proto.PathIdRequest) returns(proto.EmptyResponse);
  rpc ProjectWorkflowPage(ProjectManagementProjectWorkflowPageRequest) returns(ProjectManagementWorkflowPageResponse);
  rpc ProjectWorkflowBatch(ProjectManagementProjectWorkflowBatchRequest) returns(ProjectManagementWorkflowBatchResponse);
  rpc ProjectWorkflowCreate(ProjectManagementProjectWorkflowCreateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc ProjectWorkflowDetail(ProjectManagementProjectWorkflowDetailRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc ProjectWorkflowDelete(ProjectManagementProjectWorkflowDeleteRequest) returns(proto.EmptyResponse);
  rpc ProjectWorkflowUpdate(ProjectManagementProjectWorkflowUpdateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc ProjectWorkflowStageUpdate(ProjectManagementProjectWorkflowStageUpdateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc ProjectWorkflowDefault(ProjectManagementProjectWorkflowDefaultRequest) returns(proto.EmptyResponse);
  rpc ProjectWorkflowTemplates(proto.EmptyRequest) returns(ProjectManagementWorkflowTemplateResponse);
}
