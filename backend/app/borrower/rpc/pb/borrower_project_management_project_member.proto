syntax = "proto3";

package borrower;

option go_package = "zeebee-backend/app/borrower/rpc/pb/borrower";

import "proto/common.proto";
import "proto/entity.proto";

message ProjectManagementMemberInput {
  int64 organization_user_id = 1;
  string role = 2;
}

message ProjectManagementMemberPageRequest {
  ProjectManagementMemberPageRequestData data = 1;
}
message ProjectManagementMemberPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  ProjectManagementMemberPageRequestFilter filter = 3;
}
message ProjectManagementMemberPageRequestFilter {
  int64 project_id = 1;
  string keyword = 2;
  string role = 3;
}
message ProjectManagementMemberPageResponse {
  ProjectManagementMemberPageResponseData data = 1;
}
message ProjectManagementMemberPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated proto.ProjectManagementMemberEntity list = 5;
}

message ProjectManagementMemberCandidateRequest {
  ProjectManagementMemberCandidateRequestData data = 1;
}
message ProjectManagementMemberCandidateRequestData {
  int64 project_id = 1;
  string keyword = 2;
  string purpose = 3;
}
message ProjectManagementMemberCandidateEntity {
  int64 organization_user_id = 1;
  string full_name = 2;
  string email = 3;
}
message ProjectManagementMemberCandidateResponse {
  repeated ProjectManagementMemberCandidateEntity data = 1;
}

message ProjectManagementMemberDetailRequest {
  ProjectManagementMemberDetailRequestData data = 1;
}
message ProjectManagementMemberDetailRequestData {
  int64 id = 1;
  int64 project_id = 2;
}
message ProjectManagementMemberDetailResponse {
  proto.ProjectManagementMemberEntity data = 1;
}

message ProjectManagementMemberAddRequest {
  ProjectManagementMemberAddRequestData data = 1;
}
message ProjectManagementMemberAddRequestData {
  int64 project_id = 1;
  repeated ProjectManagementMemberInput members = 2;
}

message ProjectManagementMemberRoleUpdateRequest {
  ProjectManagementMemberRoleUpdateRequestData data = 1;
}
message ProjectManagementMemberRoleUpdateRequestData {
  int64 project_id = 1;
  int64 member_id = 2;
  string role = 3;
}

message ProjectManagementMemberDeleteRequest {
  ProjectManagementMemberDeleteRequestData data = 1;
}
message ProjectManagementMemberDeleteRequestData {
  int64 project_id = 1;
  int64 member_id = 2;
}

service ProjectManagementProjectMember {
  rpc Page(ProjectManagementMemberPageRequest) returns(ProjectManagementMemberPageResponse);
  rpc Candidate(ProjectManagementMemberCandidateRequest) returns(ProjectManagementMemberCandidateResponse);
  rpc Detail(ProjectManagementMemberDetailRequest) returns(ProjectManagementMemberDetailResponse);
  rpc Add(ProjectManagementMemberAddRequest) returns(proto.EmptyResponse);
  rpc UpdateRole(ProjectManagementMemberRoleUpdateRequest) returns(proto.EmptyResponse);
  rpc Delete(ProjectManagementMemberDeleteRequest) returns(proto.EmptyResponse);
}
