syntax = "proto3";

package borrower;
option go_package = "./borrower";

message EmptyRequest {

}

message EmptyResponse {

}

message StringSliceResponse {
  repeated string data = 1;
}

// ========================== common service=================
message OptionRequest {
  OptionRequestData data = 1;
}

message OptionRequestData {
  string name = 1;
}

message OptionResponse {
  repeated OptionEntry data = 1;
}

message OptionEntry{
  string label = 1;
  string value = 2;
}

message UsCitiesRequest {
  UsCitiesRequestData data = 1;
}

message UsCitiesRequestData {
  string state_usps = 1;
}

service common {
  rpc GetOpt(OptionRequest) returns(OptionResponse);
  rpc GetUsState(EmptyRequest) returns(StringSliceResponse);
  rpc GetUsCities(UsCitiesRequest) returns(StringSliceResponse);
}

// ================= user service ==================
// login
message UserLoginRequest {
  UserLoginRequestData data = 1;
}
message UserLoginResponse {
  UserLoginResponseData data = 1;
}

message UserLoginRequestData {
  string email = 1;
  string password = 2;
}

message UserLoginResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// register
message UserRegisterRequest {
  UserRegisterRequestData data = 1;
}
message UserRegisterResponse {
  UserRegisterResponseData data = 1;
}

message UserRegisterRequestData {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string address = 6;
  string ssn = 7;
}
message UserRegisterResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// refresh
message RefreshTokenRequest {
  RefreshTokenRequestData data = 1;
}

message RefreshTokenRequestData {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  RefreshTokenResponseData data = 1;
}

message RefreshTokenResponseData {
  string access_token = 1;
  int64 access_token_expire = 2;
}


// userinfo
message UserInfoRequest {
  UserInfoRequestData data = 1;
}

message UserInfoRequestData {
  int64 id = 1;
}

message UserinfoResponse {
  UserinfoResponseData data = 1;
}

message UserinfoResponseData {
  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string address = 6 [deprecated = true];
  string ssn = 7;
}

service user {
  // user
  rpc Login(UserLoginRequest) returns(UserLoginResponse);
  rpc Register(UserRegisterRequest) returns(UserRegisterResponse);
  rpc RefreshToken(RefreshTokenRequest) returns(RefreshTokenResponse);
  rpc UserInfo(UserInfoRequest) returns(UserinfoResponse);
}

// ================ loan service =================
message PropertyBaseEntry{
  int64 id = 1;
  string property_type = 2 [deprecated = true];
  int32 unit = 3;
  AddressEntry address = 4;
  double TotalAmount = 5;
}

message LoanPropertyEntry{
  int64 id = 1;
  string property_type = 2 ;
  PropertyBaseEntry property_base = 3;
}

message AddressEntry{
  string state = 1;
  string city = 2;
  string address1 = 3;
  string address2 = 4;
  string zip_code = 5;
}

message ApplicantEntry{
  int64 id = 1;
  //  string first_name = 2;
  //  string last_name = 3;
  bool is_primary = 4;
  string created_at = 5;
  string updated_at = 6;
  string name = 7;
  string type = 8;
  string invitation_status = 9;

}

message LoanEntry {
  int64 id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntry loan_property = 8;
  string lender_company = 10;
  string closing_date = 11;
  double holdback_amount = 12;
  double holdback_released_amount = 13;
  float rate = 14;
  double closing_fund = 15;
  double principal_amount = 16;
  double monthly_payment = 17;
  string lien_position = 18;
  string maturity_date = 19;
  int32 prepayment_penalty = 20;
  string service_company = 21;
  string paid_off_date = 22;
  string created_at = 23;
  string updated_at = 24;
  int64 lender_id = 25;
  int64 borrower_id = 26;
  repeated string business_strategy = 27;
  repeated ApplicantEntry applicants = 28;
  string source = 29;
}

message LoanCreateRequest {
  LoanCreateRequestData data = 1;
}

message LoanCreateRequestData {
  int64 borrower_id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntry loan_property = 8;
  repeated BorrowerEditApplicantEntry applicants = 9;
  string lender_company = 10;
  string closing_date = 11;
  double holdback_amount = 12;
  float rate = 13;
  double closing_fund = 14;
  double principal_amount = 15;
  double monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  int32 prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  repeated string business_strategy = 22;
}

message LoanCreateResponse {
  LoanCreateResponseData data = 1;
}

message LoanCreateResponseData {
  int64 id = 1;
}

message BorrowerEditApplicantEntry {
  string name = 1;
  string type = 2;
  bool is_primary = 3;
  int64 id = 4;
}

message BatchCreateLoanRequest {
  repeated LoanCreateRequestData data = 1;
}

message BatchCreateLoanResponse {
  LoanCreateResponseData data = 1;
}

message LoanUpdateRequest {
  LoanUpdateRequestData data = 1;
}

message LoanUpdateRequestData {
  int64 borrower_id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntry loan_property = 8;
  repeated BorrowerEditApplicantEntry applicants = 9;
  string lender_company = 10;
  string closing_date = 11;
  double holdback_amount = 12;
  float rate = 13;
  double closing_fund = 14;
  double principal_amount = 15;
  double monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  int32 prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  repeated string business_strategy = 22;
  int64 id = 23;
}


message LoanDetailRequest {
  LoanDetailRequestData data = 1;
}

message LoanDetailRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
}

message LoanDetailResponse {
  LoanEntry data = 1;
}

message LoanUpdatePendingStatusRequest {
  LoanUpdatePendingStatusRequestData data = 1;
}
message LoanUpdatePendingStatusRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
  string pending_status = 3;
}

message LoanDeleteRequest {
  LoanDeleteRequestData data = 1;
}
message LoanDeleteRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
}

message LoanPageRequest {
  LoanPageRequestData data = 1;
}

message LoanPageResponse {
  LoanPageResponseData data = 1;
}

message  LoanPageRequestFilter {
  int64 borrower_id = 1;
  string stage = 2;
  string keyword = 3;
  string keyword_type = 4;
  repeated string loan_purpose = 5;
  repeated string loan_type = 6;
  repeated string lender = 7;
  repeated string pending_status = 8;
}

message  LoanPageRequestSorter {
  string column = 1;
  string sort = 2;
}

message LoanPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  LoanPageRequestFilter filter = 3;
  LoanPageRequestSorter sorter = 4;
}

message LoanPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated LoanEntry list = 5;
}

message LoanLenderCompaniesRequest {
  LoanLenderCompaniesRequestData data = 1;
}

message LoanLenderCompaniesRequestData {
  int64 borrower_id = 1;
}

message LoanLenderCompaniesResponse {
  repeated string data = 1;
}

service Loan {
  rpc CreateBorrowerLoan(LoanCreateRequest) returns(LoanCreateResponse);
  rpc BatchCreateBorrowerLoan(BatchCreateLoanRequest) returns(EmptyResponse);
  rpc UpdateBorrowerLoan(LoanUpdateRequest) returns(EmptyResponse);
  rpc UpdateBorrowerLoanPendingStatus(LoanUpdatePendingStatusRequest) returns(EmptyResponse);
  rpc DeleteBorrowerLoan(LoanDeleteRequest) returns(EmptyResponse);
  rpc BorrowerLoanDetail(LoanDetailRequest) returns(LoanDetailResponse);
  rpc BorrowerLoanPage(LoanPageRequest) returns(LoanPageResponse);
  rpc BorrowerLoanLenderCompanies(LoanLenderCompaniesRequest) returns(LoanLenderCompaniesResponse);
}


// ===================== property service ======================

message PropertyPageEntry{
  int64 id = 1;
  string property_type = 2;
  double total_amount = 3;
  double total_principal_amount = 4;
  float avg_rate = 5;
  double total_monthly_payment_amount = 6;
  repeated string applicants = 7;
  repeated string lenders = 8;
  string nearest_maturity_date = 9;
  int64 pending_loan_count = 10;
  int64 active_loan_count = 11;
  int64 archived_loan_count = 12;
  AddressEntry address = 13;
}

message PropertyPageRequest {
  PropertyPageRequestData data = 1;
}

message PropertyPageResponse {
  PropertyPageResponseData data = 1;
}

message PropertyPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  PropertyPageRequestFilter filter = 3;
  PropertyPageRequestSorter sorter = 4;
}

message  PropertyPageRequestFilter{
  int64 borrower_id = 1;
  string keyword = 3;
  repeated string applicant = 5;
}

message  PropertyPageRequestSorter {
  string column = 1;
  string sort = 2;
}

message PropertyPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated PropertyPageEntry list = 5;
}

message PropertyDetailRequest {
  PropertyDetailRequestData data = 1;
}

message PropertyDetailResponse {
  PropertyDetailResponseData data = 1;
}

message PropertyDetailRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
}

message PropertyDetailResponseData {
  int64 id = 1;
  string property_type = 2;
  double total_amount = 3;
  int32 unit = 4;
  AddressEntry address = 5;
  double total_closing_fund_amount = 6;
  double total_principal_amount = 7;
  float avg_rate = 8;
  double total_monthly_payment_amount = 9;
  repeated LoanEntry pending_loans = 10;
  repeated LoanEntry active_loans = 11;
  repeated LoanEntry archived_loans = 12;
}


service Property {
  rpc PropertyPage(PropertyPageRequest) returns(PropertyPageResponse);
  rpc PropertyDetail(PropertyDetailRequest) returns(PropertyDetailResponse);
}

// ===================== applicant service ======================

message BorrowerNamesRequest {
  BorrowerNamesRequestData data = 1;
}

message BorrowerNamesRequestData {
  int64 borrower_id = 1;
}

message BorrowerNamesResponse {
  repeated string data = 1;
}

service Applicant {
  rpc BorrowerNames(BorrowerNamesRequest) returns(BorrowerNamesResponse);
}