// ================= organization service start =================
message OrganizationEntity {
  int64 id = 1;
  string name = 2;
  string status = 3;
  int64 owner_id = 4;
  AddressEntity address = 5;
  string contact_email = 6;
  string contact_phone = 7;
  string contact_name = 8;
  string owner_type = 9;
  string type = 10;
  string created_at = 11;
  string updated_at = 12;
  repeated OrganizationEmailEntity organization_emails = 13;
  string logo = 14;
  string website = 15;
  string tagline = 16;
  OrganizationMetadataEntity metadata = 17;
}

message OrganizationMetadataEntity {
  OrganizationLenderMetadataEntity lender = 1;

}

message OrganizationLenderMetadataEntity {
  RangeFloat loan_amount_range = 1;
  RangeInt32       loan_term_range = 2;
  RangeFloat       loan_tate_range = 3;
  RangeFloat       loan_point_range = 4;
}


message OrganizationOptionsEntity {
  int64 id = 1;
  string name = 2;
  string contact_email = 3;
  string type = 4;
}

// info --  response
message OrganizationInfoResponse {
  OrganizationEntity   data = 1;
}
// all lender--  response
message OrganizationAllLenderResponse {
  repeated OrganizationOptionsEntity data = 1;
}

// lender page --  request
message OrganizationLenderPageRequest {
  OrganizationLenderPageRequestData data = 1;
}
message OrganizationLenderPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  OrganizationLenderPageRequestFilter filter = 3;
  OrganizationLenderPageRequestSorter sorter = 4;
}
message OrganizationLenderPageRequestFilter {
  string keyword = 2;
}
message OrganizationLenderPageRequestSorter {
  string column = 1;
  string sort = 2;
}
// lender page --  response
message OrganizationLenderPageResponse {
  OrganizationLenderPageResponseData data = 1;
}
message OrganizationLenderPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated OrganizationEntity list = 5;
}

service Organization {
  rpc Profile(EmptyRequest) returns(OrganizationInfoResponse);
  rpc AllLender(EmptyRequest) returns(OrganizationAllLenderResponse);
  rpc LenderPage(OrganizationLenderPageRequest) returns(OrganizationLenderPageResponse);
}

