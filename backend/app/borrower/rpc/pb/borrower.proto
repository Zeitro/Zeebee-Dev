syntax = "proto3";

package borrower;
option go_package = "./borrower";

message EmptyRequest {

}

message EmptyResponse {

}

// ================= user service ==================
// login
message UserLoginRequest {
  UserLoginRequestData data = 1;
}
message UserLoginResponse {
  UserLoginResponseData data = 1;
}

message UserLoginRequestData {
  string email = 1;
  string password = 2;
}

message UserLoginResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// register
message UserRegisterRequest {
  UserRegisterRequestData data = 1;
}
message UserRegisterResponse {
  UserRegisterResponseData data = 1;
}

message UserRegisterRequestData {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string address = 6;
  string ssn = 7;
}
message UserRegisterResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// refresh
message RefreshTokenRequest {
  RefreshTokenRequestData data = 1;
}

message RefreshTokenRequestData {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  RefreshTokenResponseData data = 1;
}

message RefreshTokenResponseData {
  string access_token = 1;
  int64 access_token_expire = 2;
}


// userinfo
message UserInfoRequest {
  UserInfoRequestData data = 1;
}

message UserInfoRequestData {
  int64 id = 1;
}

message UserinfoResponse {
  UserinfoResponseData data = 1;
}

message UserinfoResponseData {
  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string address = 6 [deprecated = true];
  string ssn = 7;
}

service user {
  // user
  rpc Login(UserLoginRequest) returns(UserLoginResponse);
  rpc Register(UserRegisterRequest) returns(UserRegisterResponse);
  rpc RefreshToken(RefreshTokenRequest) returns(RefreshTokenResponse);
  rpc GetUserInfo(UserInfoRequest) returns(UserinfoResponse);
}

// ================ loan service =================
message PropertyEntry{
  int64 id = 1;
  string property_type = 2;
  int32 unit = 3;
  AddressEntry address = 4;
}

message AddressEntry{
  string state = 1;
  string city = 2;
  string address1 = 3;
  string address2 = 4;
  string zip_code = 5;
}

message ApplicantEntry{
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  bool is_primary = 4;
  string created_at = 5;
  string updated_at = 6;
  string full_name = 7;
}

message LoanEntry {
  int64 id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  float total_amount = 6;
  float initial_amount = 7;
  PropertyEntry property = 8;
  string lender_company = 10;
  string closing_date = 11;
  float holdback_amount = 12;
  float holdback_released_amount = 13;
  float rate = 14;
  float closing_fund = 15;
  float principal_amount = 16;
  float monthly_payment = 17;
  string lien_position = 18;
  string maturity_date = 19;
  float prepayment_penalty = 20;
  string service_company = 21;
  string paid_off_date = 22;
  string created_at = 23;
  string updated_at = 24;
  int64 lender_id = 25;
  int64 borrower_id = 26;
  repeated string business_strategy = 27;
  repeated ApplicantEntry applicants = 28;
  string source = 29;
}

message CreateLoanRequest {
  CreateLoanRequestData data = 1;
}

message CreateLoanRequestData {
  int64 borrower_id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  float total_amount = 6;
  float initial_amount = 7;
  PropertyEntry property = 8;
  string applicant_name = 9;
  string lender_company = 10;
  string closing_date = 11;
  float holdback_amount = 12;
  float rate = 13;
  float closing_fund = 14;
  float principal_amount = 15;
  float monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  float prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  repeated string business_strategy = 22;
}

message CreateLoanResponse {
  CreateLoanResponseData data = 1;
}

message CreateLoanResponseData {
  int64 id = 1;
}

message UpdateLoanRequest {
  UpdateLoanRequestData data = 1;
}

message UpdateLoanRequestData {
  int64 borrower_id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  float total_amount = 6;
  float initial_amount = 7;
  PropertyEntry property = 8;
  string applicant_name = 9;
  string lender_company = 10;
  string closing_date = 11;
  float holdback_amount = 12;
  float rate = 13;
  float closing_fund = 14;
  float principal_amount = 15;
  float monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  float prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  repeated string business_strategy = 22;
  int64 id = 23;
}


message GetLoanRequest {
  GetLoanRequestData data = 1;
}

message GetLoanRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
}

message GetLoanResponse {
  LoanEntry data = 1;
}

message UpdateLoanPendingStatusRequest {
  UpdateLoanPendingStatusRequestData data = 1;
}
message UpdateLoanPendingStatusRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
  string pending_status = 3;
}

message DeleteLoanRequest {
  DeleteLoanRequestData data = 1;
}
message DeleteLoanRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
}

service Loan {
  rpc CreateBorrowerLoan(CreateLoanRequest) returns(CreateLoanResponse);
  rpc UpdateBorrowerLoan(UpdateLoanRequest) returns(EmptyResponse);
  rpc UpdateBorrowerLoanPendingStatus(UpdateLoanPendingStatusRequest) returns(EmptyResponse);
  rpc DeleteBorrowerLoan(DeleteLoanRequest) returns(EmptyResponse);
  rpc GetBorrowerLoan(GetLoanRequest) returns(GetLoanResponse);
}