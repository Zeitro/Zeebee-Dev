syntax = "proto3";

package borrower;
option go_package = "./borrower";

message EmptyRequest {

}

message EmptyResponse {

}

message StringSliceResponse {
  repeated string data = 1;
}

// ========================== common service=================
message OptionRequest {
  OptionRequestData data = 1;
}

message OptionRequestData {
  string name = 1;
}

message OptionResponse {
  repeated OptionEntry data = 1;
}

message OptionEntry{
  string label = 1;
  string value = 2;
}

message UsCitiesRequest {
  UsCitiesRequestData data = 1;
}

message UsCitiesRequestData {
  string state_usps = 1;
}

service common {
  rpc GetOpt(OptionRequest) returns(OptionResponse);
  rpc GetUsState(EmptyRequest) returns(StringSliceResponse);
  rpc GetUsCities(UsCitiesRequest) returns(StringSliceResponse);
}

// ================= user service ==================
// login
message UserLoginRequest {
  UserLoginRequestData data = 1;
}
message UserLoginResponse {
  UserLoginResponseData data = 1;
}

message UserLoginRequestData {
  string email = 1;
  string password = 2;
}

message UserLoginResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// register
message UserRegisterRequest {
  UserRegisterRequestData data = 1;
}
message UserRegisterResponse {
  UserRegisterResponseData data = 1;
}

message UserRegisterRequestData {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string address = 6;
  string ssn = 7;
}
message UserRegisterResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// refresh
message RefreshTokenRequest {
  RefreshTokenRequestData data = 1;
}

message RefreshTokenRequestData {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  RefreshTokenResponseData data = 1;
}

message RefreshTokenResponseData {
  string access_token = 1;
  int64 access_token_expire = 2;
}


// userinfo
message UserInfoRequest {
  UserInfoRequestData data = 1;
}

message UserInfoRequestData {
  int64 id = 1;
}

message UserinfoResponse {
  UserinfoResponseData data = 1;
}

message UserinfoResponseData {
  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone_number = 5;
  string address = 6 [deprecated = true];
  string ssn = 7;
}

service user {
  // user
  rpc Login(UserLoginRequest) returns(UserLoginResponse);
  rpc Register(UserRegisterRequest) returns(UserRegisterResponse);
  rpc RefreshToken(RefreshTokenRequest) returns(RefreshTokenResponse);
  rpc UserInfo(UserInfoRequest) returns(UserinfoResponse);
}

// ================ loan service =================
message PropertyBaseEntry{
  int64 id = 1;
  string property_type = 2 [deprecated = true];
  int32 unit = 3;
  AddressEntry address = 4;
  double TotalAmount = 5;
}

message LoanPropertyEntry{
  int64 id = 1;
  string property_type = 2 ;
  PropertyBaseEntry property_base = 3;
  float living_area_sqft = 5;
  int32 bedrooms = 6;
  int32 bathrooms = 7;
}

message AddressEntry{
  string state = 1;
  string city = 2;
  string address1 = 3;
  string address2 = 4;
  string zip_code = 5;
}

message ApplicantEntry{
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  bool is_primary = 4;
  string created_at = 5;
  string updated_at = 6;
  string mid_name = 7;
  string type = 8;
  string invitation_status = 9;
  string full_name = 10;
  int64  loan_property_id = 11;
  string ssn = 12;
  string dob = 13;
  string marital_status = 14;
  string email = 15;
  int32 est_credit_score = 16;
  string driver_license_num = 17;
  AddressEntry address = 18;
  int64  loan_borrower_id = 19;
}

message LoanEntry {
  int64 id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntry loan_property = 8;
  string lender_company = 10;
  string closing_date = 11;
  double holdback_amount = 12;
  double holdback_released_amount = 13;
  float rate = 14;
  double closing_fund = 15;
  double principal_amount = 16;
  double monthly_payment = 17;
  string lien_position = 18;
  string maturity_date = 19;
  int32 prepayment_penalty = 20;
  string service_company = 21;
  string paid_off_date = 22;
  string created_at = 23;
  string updated_at = 24;
  int64 lender_id = 25;
  int64 borrower_id = 26;
  repeated string business_strategy = 27;
  repeated ApplicantEntry applicants = 28;
  string source = 29;
  string existing_lender_company = 30;
  float existing_rate = 31;
  string existing_maturity_date = 32;
  double purchase_amount = 33;
  string purchase_date = 34;
  bool has_assignment_fee = 35;
  double assignment_fee_amount = 36;
  bool has_subordinate_debt = 37;
  double subordinate_debt_amount = 38;
  string scheduled_close_escrow_date = 39;
  int32 loan_term = 40;
  double arv = 41;
  double ltv = 42;
  double liquidity_amount = 43;
  LoanBudgetEntity budget = 44;
  bool mid_construction = 45;
  int32 est_credit_score = 46;
  double est_yearly_rental_income = 47;
  float dscr = 48;
  double reserves = 49;
  bool has_delayed_financing = 50;
  bool has_collateralized_blanket = 51;
  bool has_properties_vacant = 52;
  bool has_short_term_rental = 53;
  string additional_info = 54;
}

message  LoanBudgetEntity {
  float original_budget = 1;
  float remaining_budget = 2;
  float cost_spent_to_date_amount = 3;
}

message LoanCreateRequest {
  LoanCreateRequestData data = 1;
}

message LoanCreateRequestData {
  int64 borrower_id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntry loan_property = 8;
  repeated BorrowerEditApplicantEntry applicants = 9;
  string lender_company = 10;
  string closing_date = 11;
  double holdback_amount = 12;
  float rate = 13;
  double closing_fund = 14;
  double principal_amount = 15;
  double monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  int32 prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  repeated string business_strategy = 22;
}

message LoanCreateResponse {
  LoanCreateResponseData data = 1;
}

message LoanCreateResponseData {
  int64 id = 1;
}

message BorrowerEditApplicantEntry {
  string name = 1 [deprecated = true];
  string type = 2;
  bool is_primary = 3;
  int64 id = 4;
  string first_name = 5;
  string last_name = 6;
  string mid_name = 7;
}

message BatchCreateLoanRequest {
  repeated LoanCreateRequestData data = 1;
}

message BatchCreateLoanResponse {
  LoanCreateResponseData data = 1;
}

message LoanUpdateRequest {
  LoanUpdateRequestData data = 1;
}

message LoanUpdateRequestData {
  int64 borrower_id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntry loan_property = 8;
  repeated BorrowerEditApplicantEntry applicants = 9;
  string lender_company = 10;
  string closing_date = 11;
  double holdback_amount = 12;
  float rate = 13;
  double closing_fund = 14;
  double principal_amount = 15;
  double monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  int32 prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  repeated string business_strategy = 22;
  int64 id = 23;
}


message LoanDetailRequest {
  LoanDetailRequestData data = 1;
}

message LoanDetailRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
}

message LoanDetailResponse {
  LoanEntry data = 1;
}

message LoanUpdatePendingStatusRequest {
  LoanUpdatePendingStatusRequestData data = 1;
}
message LoanUpdatePendingStatusRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
  string pending_status = 3;
}

message LoanDeleteRequest {
  LoanDeleteRequestData data = 1;
}
message LoanDeleteRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
}

message LoanPageRequest {
  LoanPageRequestData data = 1;
}

message LoanPageResponse {
  LoanPageResponseData data = 1;
}

message  LoanPageRequestFilter {
  int64 borrower_id = 1;
  string stage = 2;
  string keyword = 3;
  string keyword_type = 4;
  repeated string loan_purpose = 5;
  repeated string loan_type = 6;
  repeated string lender = 7;
  repeated string pending_status = 8;
}

message  LoanPageRequestSorter {
  string column = 1;
  string sort = 2;
}

message LoanPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  LoanPageRequestFilter filter = 3;
  LoanPageRequestSorter sorter = 4;
}

message LoanPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated LoanEntry list = 5;
}

message LoanLenderCompaniesRequest {
  LoanLenderCompaniesRequestData data = 1;
}

message LoanLenderCompaniesRequestData {
  int64 borrower_id = 1;
}

message LoanLenderCompaniesResponse {
  repeated string data = 1;
}

message ApplyLoanRequest {
  ApplyLoanRequestData data = 1;
}
message ApplyLoanRequestData {
  string loan_purpose = 1;
  string loan_type = 2;
  double total_amount = 3;
  double initial_amount = 4;
  LoanPropertyEntry loan_property = 5;
  double holdback_amount = 6;
  double principal_amount = 7;
  string maturity_date = 8;
  int32 prepayment_penalty = 9;
  int64 lender_id = 10;
  int64 borrower_id = 11;
  repeated string business_strategy = 12;
  repeated ApplicantEntry applicants = 13;
  string existing_lender_company = 14;
  float existing_rate = 15;
  string existing_maturity_date = 16;
  double purchase_amount = 17;
  string purchase_date = 18;
  bool has_assignment_fee = 19;
  double assignment_fee_amount = 20;
  bool has_subordinate_debt = 21;
  double subordinate_debt_amount = 22;
  string scheduled_close_escrow_date = 23;
  int32 loan_term = 24;
  double arv = 25;
  double ltv = 26;
  double liquidity_amount = 27;
  LoanBudgetEntity budget = 28;
  bool mid_construction = 29;
  int32 est_credit_score = 30;
  double est_yearly_rental_income = 31;
  float dscr = 32;
  double reserves = 33;
  bool has_delayed_financing = 34;
  bool has_collateralized_blanket = 35;
  bool has_properties_vacant = 36;
  bool has_short_term_rental = 37;
  string additional_info = 38;
  repeated LoanThirdServiceEntity experience_services = 39;
  repeated LoanThirdServiceEntity real_estate_services = 40;
  LoanBorrowerEntry loan_borrower = 41;
  LoanDemographicEntity loan_demographic = 42;
}

message ApplyLoanResponse {
  ApplyLoanResponseData data = 1;
}
message ApplyLoanResponseData {
  int64 id = 1;
}

service Loan {
  rpc CreateBorrowerLoan(LoanCreateRequest) returns(LoanCreateResponse);
  rpc BatchCreateBorrowerLoan(BatchCreateLoanRequest) returns(EmptyResponse);
  rpc UpdateBorrowerLoan(LoanUpdateRequest) returns(EmptyResponse);
  rpc UpdateBorrowerLoanPendingStatus(LoanUpdatePendingStatusRequest) returns(EmptyResponse);
  rpc DeleteBorrowerLoan(LoanDeleteRequest) returns(EmptyResponse);
  rpc BorrowerLoanDetail(LoanDetailRequest) returns(LoanDetailResponse);
  rpc BorrowerLoanPage(LoanPageRequest) returns(LoanPageResponse);
  rpc BorrowerLoanLenderCompanies(LoanLenderCompaniesRequest) returns(LoanLenderCompaniesResponse);
  rpc ApplyLoan(ApplyLoanRequest) returns(ApplyLoanResponse);
}


// ===================== property service ======================

message PropertyPageEntry{
  int64 id = 1;
  string property_type = 2;
  double total_amount = 3;
  double total_principal_amount = 4;
  float avg_rate = 5;
  double total_monthly_payment_amount = 6;
  repeated string applicants = 7;
  repeated string lenders = 8;
  string nearest_maturity_date = 9;
  int64 pending_loan_count = 10;
  int64 active_loan_count = 11;
  int64 archived_loan_count = 12;
  AddressEntry address = 13;
}

message PropertyPageRequest {
  PropertyPageRequestData data = 1;
}

message PropertyPageResponse {
  PropertyPageResponseData data = 1;
}

message PropertyPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  PropertyPageRequestFilter filter = 3;
  PropertyPageRequestSorter sorter = 4;
}

message  PropertyPageRequestFilter{
  int64 borrower_id = 1;
  string keyword = 3;
  repeated string applicant = 5;
}

message  PropertyPageRequestSorter {
  string column = 1;
  string sort = 2;
}

message PropertyPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated PropertyPageEntry list = 5;
}

message PropertyDetailRequest {
  PropertyDetailRequestData data = 1;
}

message PropertyDetailResponse {
  PropertyDetailResponseData data = 1;
}

message PropertyDetailRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
}

message PropertyDetailResponseData {
  int64 id = 1;
  string property_type = 2;
  double total_amount = 3;
  int32 unit = 4;
  AddressEntry address = 5;
  double total_closing_fund_amount = 6;
  double total_principal_amount = 7;
  float avg_rate = 8;
  double total_monthly_payment_amount = 9;
  repeated LoanEntry pending_loans = 10;
  repeated LoanEntry active_loans = 11;
  repeated LoanEntry archived_loans = 12;
}


service Property {
  rpc PropertyPage(PropertyPageRequest) returns(PropertyPageResponse);
  rpc PropertyDetail(PropertyDetailRequest) returns(PropertyDetailResponse);
}

// ===================== applicant service ======================

message BorrowerNamesRequest {
  BorrowerNamesRequestData data = 1;
}

message BorrowerNamesRequestData {
  int64 borrower_id = 1;
}

message BorrowerNamesResponse {
  repeated string data = 1;
}

service Applicant {
  rpc BorrowerNames(BorrowerNamesRequest) returns(BorrowerNamesResponse);
}

// ===================== loan borrower service ======================
message LoanBorrowerEntry{
  int64 id = 1;
  int64 loan_id = 2;
  string type = 3;
  string name = 4;
  string tin_type = 5;
  string tin = 6;
  AddressEntry mailing_address = 7;
  string contact_email = 8;
  string contact_phone = 9;
  string contact_name = 10;
  int32 own_percent = 11;
}

// ===================== lender service ======================
message LenderEntry{
  int64 id = 1;
  string name = 2;
  AddressEntry address = 3;
  string status = 4;
}

// ===================== loan experience service ======================
message LoanExperienceEntry{
  int64 id = 1;
  int64 loan_id = 2;
  string city = 3;
  string state = 4;
  string ownership_on_title = 5;
  string property_type = 6;
  double purchase_amount = 7;
  string purchase_date = 8;
  double sold_amount = 9;
  string sold_date = 10;
  double budget_or_cost = 11;
  double profit = 12;
  bool is_tenant_occupied = 13;
  string type = 14;
}

// ===================== loan third service service ======================
message LoanThirdServiceEntity{
  int64 id = 1;
  int64 loan_id = 2;
  string type = 3;
  string name = 4;
  string email = 5;
  string phone = 6;
}

// ===================== loan demographic service ======================
message LoanDemographicEntity{
  int64 id = 1;
  int64 loan_id = 2;
  LoanDemographicProperty property = 3;
  LoanDemographicEthnicity ethnicity = 4;
  LoanDemographicRace race = 5;
  string sex = 6;
  LoanDemographicExtraDemographic extra_demographic = 7;
}

message LoanDemographicProperty {
  bool as_primary_resident = 1;
  bool has_transaction_relationship = 2;
  bool has_borrowed_money = 3;
  double borrowed_money_amount = 4;
  bool has_another_mortgage_loan = 5;
  bool has_priority_over1st = 6;
  bool has_outstanding_judgements = 7;
  bool has_federal_debt = 8;
  bool has_a_lawsuit = 9;
  bool has_conveyed_title = 10;
  bool has_a_pre_foreclosure_sale = 11;
  bool has_foreclosed_upon = 12;
  bool has_a_bankruptcy = 13;
  bool bankruptcy_chapter7 = 14;
  bool bankruptcy_chapter11 = 15;
  bool bankruptcy_chapter12 = 16;
  bool bankruptcy_chapter13 = 17;
}

message LoanDemographicEthnicity {
  bool is_hispanic_or_latino = 1;
  bool is_other_hispanic_or_latino = 2;
  string other_hispanic_or_latino_name = 3;
  bool is_mexican = 4;
  bool is_cuban = 5;
  bool is_not_hispanic_or_latino = 6;
  bool hidden = 7;
}

message LoanDemographicRace {
  bool is_american_indian_or_alaska_native = 1;
  string american_indian_or_alaska_native_name = 2;
  bool is_asian = 3;
  bool is_asian_indian = 4;
  bool is_asian_chinese = 5;
  bool is_asian_filipino = 6;
  bool is_asian_japanese = 7;
  bool is_asian_korean = 8;
  bool is_asian_vietnamese = 9;
  bool is_asian_other = 10;
  string asian_other_name = 11;
  bool is_black_or_african_american = 12;
  bool is_native_hawaiian_or_other_pacific_islander = 13;
  bool is_native_hawaiian_guamanian_or_chamorro_samoan = 14;
  bool is_other_pacific_islander = 15;
  string other_pacific_islander_name = 16;
  bool is_white = 17;
  bool hidden = 18;
}

message LoanDemographicExtraDemographic {
  bool is_ethnicity_collected_by_observation = 1;
  bool is_sex_collected_by_observation = 2;
  bool is_race_collected_by_observation = 3;
  bool is_by_face_to_face = 4;
  bool is_by_telephone = 5;
  bool is_by_fox_or_mail = 6;
  bool is_by_email_or_internet = 7;
}