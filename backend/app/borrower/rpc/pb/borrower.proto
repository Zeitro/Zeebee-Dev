  rpc Delete(OrganizationUserDeleteRequest) returns(EmptyResponse);
  rpc Detail(OrganizationUserDetailRequest) returns(OrganizationUserDetailResponse);
  rpc SwitchStatus(OrganizationUserUpdateStatusRequest) returns(EmptyResponse);
  rpc All(EmptyRequest) returns(OrganizationUserAllResponse);
  rpc SendInvitationEmail(OrganizationUserSendInvitationEmailRequest) returns(EmptyResponse);
  rpc AcceptInvitation(OrganizationUserAcceptInvitationRequest) returns(UserLoginResponse);
  rpc AssignRoles(OrganizationUserAssignRolesRequest) returns(EmptyResponse);
}

