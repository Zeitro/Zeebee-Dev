syntax = "proto3";

package borrower;

option go_package = "zeebee-backend/app/borrower/rpc/pb/borrower";

import "proto/common.proto";
import "proto/entity.proto";

message ProjectManagementWorkflowTransitionAllRequest {
  ProjectManagementWorkflowTransitionAllRequestData data = 1;
}
message ProjectManagementWorkflowTransitionAllRequestData {
  int64 workflow_id = 1;
  int64 from_stage_id = 2;
}
message ProjectManagementWorkflowTransitionAllResponse {
  repeated proto.ProjectManagementWorkflowTransitionEntity data = 1;
}

message ProjectManagementWorkflowTransitionCreateRequest {
  ProjectManagementWorkflowTransitionCreateRequestData data = 1;
}
message ProjectManagementWorkflowTransitionCreateRequestData {
  int64 workflow_id = 1;
  int64 from_stage_id = 2;
  int64 to_stage_id = 3;
  repeated string allowed_actor_types = 4;
}

message ProjectManagementWorkflowTransitionUpdateRequest {
  ProjectManagementWorkflowTransitionUpdateRequestData data = 1;
}
message ProjectManagementWorkflowTransitionUpdateRequestData {
  int64 workflow_id = 1;
  int64 id = 2;
  int64 to_stage_id = 3;
  repeated string allowed_actor_types = 4;
}

message ProjectManagementWorkflowTransitionDetailRequest {
  ProjectManagementWorkflowTransitionDetailRequestData data = 1;
}
message ProjectManagementWorkflowTransitionDetailRequestData {
  int64 workflow_id = 1;
  int64 id = 2;
}

message ProjectManagementWorkflowTransitionDetailResponse {
  proto.ProjectManagementWorkflowTransitionEntity data = 1;
}

service ProjectManagementWorkflowTransition {
  rpc All(ProjectManagementWorkflowTransitionAllRequest) returns(ProjectManagementWorkflowTransitionAllResponse);
  rpc Detail(ProjectManagementWorkflowTransitionDetailRequest) returns(ProjectManagementWorkflowTransitionDetailResponse);
  rpc Create(ProjectManagementWorkflowTransitionCreateRequest) returns(ProjectManagementWorkflowTransitionDetailResponse);
  rpc Update(ProjectManagementWorkflowTransitionUpdateRequest) returns(ProjectManagementWorkflowTransitionDetailResponse);
  rpc Delete(ProjectManagementWorkflowTransitionDetailRequest) returns(proto.EmptyResponse);
}
