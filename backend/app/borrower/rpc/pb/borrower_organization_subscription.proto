syntax = "proto3";

package borrower;

option go_package = "zeebee-backend/app/borrower/rpc/pb/borrower";

import "proto/common.proto";

message PricingPlanPolicyEntity {
  int64 id = 1;
  int64 pricing_plan_id = 2;
  double original_amount = 3;
  double actual_amount = 4;
  string type = 5;
}

message PricingPlanEntity {
  int64 id = 1;
  string name = 2;
  string subtitle = 3;
  string description = 4;
  int32 trial_days = 5;
  int32 sort_order = 6;
  bool is_default = 7;
  string type = 8;
  string plan_type = 9;
  repeated PricingPlanPolicyEntity policies = 10;
}

message PublicPricingPlansResponse {
  repeated PricingPlanEntity data = 1;
}

message OrganizationSubscriptionEntity {
  int64 id = 1;
  string code = 2;
  int64 organization_id = 3;
  int64 pricing_plan_id = 4;
  PricingPlanEntity pricing_plan = 5;
  int64 pricing_plan_policy_id = 6;
  PricingPlanPolicyEntity pricing_plan_policy = 7;
  string status = 8;
  string expire_date = 9;
  double original_amount = 10;
  double actual_amount = 11;
  bool is_auto_renew = 12;
  string source = 13;
}

message SubscriptionCurrentResponse {
  OrganizationSubscriptionEntity data = 1;
}

message CheckoutSessionCreateRequest {
  CheckoutSessionCreateRequestData data = 1;
}
message CheckoutSessionCreateRequestData {
  int64 pricing_plan_id = 1;
  int64 pricing_plan_policy_id = 2;
}
message CheckoutSessionCreateResponse {
  string checkout_url = 1;
}

message SubscriptionAutoRenewRequest {
  SubscriptionAutoRenewRequestData data = 1;
}
message SubscriptionAutoRenewRequestData {
  bool enabled = 1;
}

service OrganizationSubscription {
  rpc PublicPlans(proto.EmptyRequest) returns(PublicPricingPlansResponse);
  rpc Current(proto.EmptyRequest) returns(SubscriptionCurrentResponse);
  rpc CreateCheckoutSession(CheckoutSessionCreateRequest) returns(CheckoutSessionCreateResponse);
  rpc SetAutoRenew(SubscriptionAutoRenewRequest) returns(proto.EmptyResponse);
}
