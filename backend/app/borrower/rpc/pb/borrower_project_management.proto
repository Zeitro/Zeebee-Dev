}
message ProjectManagementTaskTransitionRequest {
  ProjectManagementTaskTransitionRequestData data = 1;
}
message ProjectManagementTaskTransitionRequestData {
  int64 task_id = 1;
  int64 target_stage_id = 2;
}

// ProjectManagement owns borrower project management RPC methods.
service ProjectManagement {
  rpc WorkflowAll(ProjectManagementWorkflowAllRequest) returns(ProjectManagementWorkflowAllResponse);
  rpc WorkflowPage(ProjectManagementWorkflowPageRequest) returns(ProjectManagementWorkflowPageResponse);
  rpc WorkflowDetail(ProjectManagementWorkflowDetailRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc WorkflowCreate(ProjectManagementWorkflowCreateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc WorkflowUpdate(ProjectManagementWorkflowUpdateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc WorkflowDelete(ProjectManagementWorkflowDeleteRequest) returns(proto.EmptyResponse);
  rpc TaskTypePage(ProjectManagementTaskTypePageRequest) returns(ProjectManagementTaskTypePageResponse);
  rpc TaskTypeCreate(ProjectManagementTaskTypeCreateRequest) returns(ProjectManagementTaskTypeDetailResponse);
  rpc TaskTypeUpdate(ProjectManagementTaskTypeUpdateRequest) returns(ProjectManagementTaskTypeDetailResponse);
  rpc TaskTypeDelete(ProjectManagementTaskTypeDeleteRequest) returns(proto.EmptyResponse);
  rpc ProjectPage(ProjectManagementProjectPageRequest) returns(ProjectManagementProjectPageResponse);
  rpc ProjectDetail(ProjectManagementProjectDetailRequest) returns(ProjectManagementProjectDetailResponse);
  rpc ProjectCreate(ProjectManagementProjectCreateRequest) returns(ProjectManagementProjectDetailResponse);
  rpc ProjectUpdate(ProjectManagementProjectUpdateRequest) returns(ProjectManagementProjectDetailResponse);
  rpc ProjectDelete(ProjectManagementProjectDeleteRequest) returns(proto.EmptyResponse);
  rpc MemberPage(ProjectManagementMemberPageRequest) returns(ProjectManagementMemberPageResponse);
  rpc MemberCandidate(ProjectManagementMemberCandidateRequest) returns(ProjectManagementMemberCandidateResponse);
  rpc MemberAdd(ProjectManagementMemberAddRequest) returns(proto.EmptyResponse);
  rpc MemberUpdate(ProjectManagementMemberUpdateRequest) returns(proto.EmptyResponse);
  rpc MemberDelete(ProjectManagementMemberDeleteRequest) returns(proto.EmptyResponse);
  rpc ProjectWorkflowDetail(ProjectManagementProjectWorkflowDetailRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc ProjectWorkflowUpdate(ProjectManagementProjectWorkflowUpdateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc TaskPage(ProjectManagementTaskPageRequest) returns(ProjectManagementTaskPageResponse);
  rpc TaskCreate(ProjectManagementTaskCreateRequest) returns(ProjectManagementTaskDetailResponse);
  rpc TaskDetail(ProjectManagementTaskDetailRequest) returns(ProjectManagementTaskDetailResponse);
  rpc TaskUpdate(ProjectManagementTaskUpdateRequest) returns(ProjectManagementTaskDetailResponse);
  rpc TaskDelete(ProjectManagementTaskDeleteRequest) returns(proto.EmptyResponse);
  rpc MyTaskPage(ProjectManagementMyTaskPageRequest) returns(ProjectManagementTaskPageResponse);
  rpc TaskAssigneeUpdate(ProjectManagementTaskAssigneeUpdateRequest) returns(ProjectManagementTaskDetailResponse);
  rpc AttachmentPage(ProjectManagementAttachmentPageRequest) returns(ProjectManagementAttachmentPageResponse);
  rpc AttachmentCreate(ProjectManagementAttachmentCreateRequest) returns(ProjectManagementAttachmentDetailResponse);
  rpc AttachmentDelete(ProjectManagementAttachmentDeleteRequest) returns(proto.EmptyResponse);
  rpc DependencyPage(ProjectManagementDependencyPageRequest) returns(ProjectManagementDependencyPageResponse);
  rpc DependencyCreate(ProjectManagementDependencyCreateRequest) returns(ProjectManagementDependencyDetailResponse);
  rpc DependencyUpdate(ProjectManagementDependencyUpdateRequest) returns(ProjectManagementDependencyDetailResponse);
  rpc DependencyDelete(ProjectManagementDependencyDeleteRequest) returns(proto.EmptyResponse);
  rpc TaskTransition(ProjectManagementTaskTransitionRequest) returns(ProjectManagementTaskDetailResponse);
  rpc OperationPage(ProjectManagementOperationPageRequest) returns(ProjectManagementOperationPageResponse);
}
