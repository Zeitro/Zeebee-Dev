syntax = "proto3";

package borrower;

option go_package = "zeebee-backend/app/borrower/rpc/pb/borrower";

import "proto/common.proto";
import "proto/entity.proto";

message ProjectManagementProjectPageRequest {
  ProjectManagementProjectPageRequestData data = 1;
}
message ProjectManagementProjectPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  ProjectManagementProjectPageRequestFilter filter = 3;
}
message ProjectManagementProjectPageRequestFilter {
  string keyword = 1;
  int64 entity_id = 2;
  string entity_type = 3;
}
message ProjectManagementProjectPageResponse {
  ProjectManagementProjectPageResponseData data = 1;
}
message ProjectManagementProjectPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated proto.ProjectManagementProjectEntity list = 5;
}

message ProjectManagementProjectDetailResponse {
  proto.ProjectManagementProjectEntity data = 1;
}

message ProjectManagementProjectCreateRequest {
  ProjectManagementProjectCreateRequestData data = 1;
}
message ProjectManagementProjectCreateRequestData {
  int64 entity_id = 1;
  string name = 2;
  string description = 3;
  string cover_url = 4;
  reserved 5;
  string entity_type = 6;
  string priority = 7;
  string project_type = 8;
  string start_at = 9;
  int64 period_value = 10;
  string period_unit = 11;
  int64 template_id = 12;
  bool copy_assignees = 13;
}

message ProjectManagementProjectUpdateRequest {
  ProjectManagementProjectUpdateRequestData data = 1;
}
message ProjectManagementProjectUpdateRequestData {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string cover_url = 4;
  string priority = 5;
  string start_at = 6;
  int64 period_value = 7;
  string period_unit = 8;
}

message ProjectManagementProjectDeleteRequest {
  ProjectManagementProjectDeleteRequestData data = 1;
}
message ProjectManagementProjectDeleteRequestData {
  int64 id = 1;
}

message ProjectManagementProjectOwnerTransferRequest {
  ProjectManagementProjectOwnerTransferRequestData data = 1;
}
message ProjectManagementProjectOwnerTransferRequestData {
  int64 project_id = 1;
  int64 organization_user_id = 2;
}

service ProjectManagementProject {
  rpc Page(ProjectManagementProjectPageRequest) returns(ProjectManagementProjectPageResponse);
  rpc Detail(proto.PathIdRequest) returns(ProjectManagementProjectDetailResponse);
  rpc Create(ProjectManagementProjectCreateRequest) returns(ProjectManagementProjectDetailResponse);
  rpc Update(ProjectManagementProjectUpdateRequest) returns(ProjectManagementProjectDetailResponse);
  rpc Delete(ProjectManagementProjectDeleteRequest) returns(proto.EmptyResponse);
  rpc TransferOwner(ProjectManagementProjectOwnerTransferRequest) returns(proto.EmptyResponse);
}
