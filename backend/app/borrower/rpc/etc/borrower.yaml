Name: borrower.rpc
ListenOn: 0.0.0.0:10001
Mode: dev
MaxFailedLoginTimes: 5
ForbiddenLoginSeconds: 300

JwtAuth:
  AccessSecret: accessSecret
  AccessExpire: 3600
  RefreshSecret: refreshSecret
  RefreshExpire: 86400

