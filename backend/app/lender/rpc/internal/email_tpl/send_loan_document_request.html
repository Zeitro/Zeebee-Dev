<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ZeeBee User Email</title>
</head>
<body>
<div
        style="
        max-width: 600px;
        margin: 0 auto;
        padding: 32px 24px 0;
        text-align: center;
        color: rgba(0, 0, 0, 0.65);
        font-size: 14px;
        font-family: Roboto, sans-serif;
      "
>
    <img
            src="https://zeebee-files-staging.s3.us-west-1.amazonaws.com/files-dev/logo.png"
            alt="logo"
            style="height: 28px"
    />
    <div
            style="
          font-size: 20px;
          font-weight: 500;
          line-height: 28px;
          color: #000;
          font-family: Roboto, sans-serif;
          padding: 28px 0;
          text-align: left;
        "
    >
        Hello {{.first_name}},
    </div>

    <div
            style="
          color: #000;
          font-family: Roboto, sans-serif;
          font-size: 14px;
        "
    >
        Pls unload your loan documents
    </div>
    <div
            style="
          width: 100%;
          padding: 24px;
          font-size: 12px;
          background-color: #f5f5f5;
          border-top: 1px solid rgba(5, 145, 255, 0.1);
          margin-top: 60px;
          font-family: Roboto, sans-serif;
          color: rgba(0, 0, 0, 0.65);
        "
    >
        <ul>
            {{range .loan_documents}}
            <li>
                {{.FileType}}
            </li>
            {{end}}
        </ul>
    </div>
</div>
</body>
</html>
