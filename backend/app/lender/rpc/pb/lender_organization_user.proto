syntax = "proto3";

package lender;

option go_package = "zeebee-backend/app/lender/rpc/pb/lender";

import "proto/common.proto";
import "proto/entity.proto";
import "proto/user.proto";


message OrganizationUserPageEntity {
  int64 id = 1;
  string status = 2;
  string first_name = 3;
  string mid_name = 4;
  string last_name = 5;
  string full_name = 6;
  string phone = 7;
  string remark = 8;
  string created_at = 9;
  string updated_at = 10;
  string email = 11;
  repeated proto.RoleEntity roles = 12;
  bool is_owner = 13;
}
// page --  request
message OrganizationUserPageRequest {
  OrganizationUserPageRequestData data = 1;
}
message OrganizationUserPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  OrganizationUserPageRequestFilter filter = 3;
  proto.CommonPageSorter sorter = 4;
}
message OrganizationUserPageRequestFilter {
  string keyword = 2;
  string status = 3;
  int64 role_id = 4;
}
// page --  response
message OrganizationUserPageResponse {
  OrganizationUserPageResponseData data = 1;
}
message OrganizationUserPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated OrganizationUserPageEntity list = 5;
}
//  create --  request
message OrganizationUserCreateRequest {
  OrganizationUserCreateRequestData data = 1;
}
message OrganizationUserCreateRequestData {
  string email = 1;
  string phone = 2;
  string remark = 3;
  repeated int64 role_ids = 4;
}

//  update --  request
message OrganizationUserUpdateRequest {
  OrganizationUserUpdateRequestData data = 1;
}
message OrganizationUserUpdateRequestData {
  int64 id = 1;
  string phone = 2;
  string remark = 3;
  repeated int64 role_ids = 4;
  string first_name = 5;
  string last_name = 6;
}

//  detail --  response
message OrganizationUserDetailResponse {
  proto.OrganizationUserEntity data = 1;
}

//  switch status --  request
message OrganizationUserUpdateStatusRequest {
  OrganizationUserUpdateStatusRequestData data = 1;
}
message OrganizationUserUpdateStatusRequestData {
  int64 id = 1;
  string status = 2;
}
// all --  request
message OrganizationUserAllResponse {
  repeated proto.OrganizationUserEntity data = 1;
}

// accept invitation email --  request
message OrganizationUserAcceptInvitationRequest {
  OrganizationUserAcceptInvitationRequestData data = 1;
}
message OrganizationUserAcceptInvitationRequestData {
  string code = 1;
  string email = 2;
  int64 organization_id = 3;
  string first_name = 4;
  string last_name = 5;
}

// check invitation --  request
message OrganizationUserCheckInvitationRequest {
  OrganizationUserCheckInvitationRequestData data = 1;
}
message OrganizationUserCheckInvitationRequestData {
  string code = 1;
  string email = 2;
  int64 organization_id = 3;
}

// check invitation --  response
message OrganizationUserCheckInvitationResponse {
  OrganizationUserCheckInvitationResponseData data = 1;
}
message OrganizationUserCheckInvitationResponseData {
  bool is_expired = 1;
}

// assign roles --  request
message OrganizationUserAssignRolesRequest {
  OrganizationUserAssignRolesRequestData data = 1;
}
message OrganizationUserAssignRolesRequestData {
  int64 id = 1;
  repeated int64 role_ids = 2;
}

service OrganizationUser {
  rpc Page(OrganizationUserPageRequest) returns(OrganizationUserPageResponse);
  rpc Create(OrganizationUserCreateRequest) returns(OrganizationUserDetailResponse);
  rpc Update(OrganizationUserUpdateRequest) returns(OrganizationUserDetailResponse);
  rpc Delete(proto.PathIdRequest) returns(proto.EmptyResponse);
  rpc Detail(proto.PathIdRequest) returns(OrganizationUserDetailResponse);
  rpc SwitchStatus(OrganizationUserUpdateStatusRequest) returns(proto.EmptyResponse);
  rpc All(proto.EmptyRequest) returns(OrganizationUserAllResponse);
  rpc SendInvitationEmail(proto.PathIdRequest) returns(proto.EmptyResponse);
  rpc AcceptInvitation(OrganizationUserAcceptInvitationRequest) returns(proto.UserLoginResponse);
  rpc CheckInvitation(OrganizationUserCheckInvitationRequest) returns(OrganizationUserCheckInvitationResponse);
  rpc AssignRoles(OrganizationUserAssignRolesRequest) returns(proto.EmptyResponse);
}