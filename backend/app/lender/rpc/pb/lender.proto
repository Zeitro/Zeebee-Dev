// ===================== loan document service start ======================
message LoanDocumentEntry {
  int64 id = 1;
  int64 loan_id = 2;
  string category = 3;
  string file_type = 4;
  string comment = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
  repeated FileEntry files = 9;
  string LastUploadedAt = 10;
}

message LoanDocumentOptEntry {
  int64 id = 1;
  string file_type = 2;
  string category = 3;
}

// update loan document comment
message LoanDocumentUpdateCommentRequest {
  LoanDocumentUpdateCommentRequestData data = 1;
}
message LoanDocumentUpdateCommentRequestData {
  int64 id = 1;
  int64 lender_company_id = 2;
  int64 lender_employee_id = 3;
  string comment = 4;
}

// delete loan document request
message LoanDocumentDeleteRequestRequest {
  LoanDocumentDeleteRequestRequestData data = 1;
}
message LoanDocumentDeleteRequestRequestData {
  int64 id = 1;
  int64 lender_company_id = 2;
  int64 lender_employee_id = 3;
}

// delete loan document file
message LoanDocumentDeleteFileRequest {
  LoanDocumentDeleteFileRequestData data = 1;
}
message LoanDocumentDeleteFileRequestData {
  int64 id = 1;
  int64 lender_company_id = 2;
  int64 lender_employee_id = 3;
  int64 file_id = 4;
}

// send document requests
message LoanDocumentSendRequestsRequest {
  LoanDocumentSendRequestsRequestData data = 1;
}
message LoanDocumentSendRequestsRequestData {
  int64 lender_company_id = 1;
  int64 lender_employee_id = 2;
  repeated SendDocumentRequestEntry documents = 3;
}

message SendDocumentRequestEntry {
  int64 id = 1;
  string comment = 2;
}

