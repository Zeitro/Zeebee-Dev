  LoanDocumentCreateExtendTypeRequestData data = 1;
}
message LoanDocumentCreateExtendTypeRequestData {
  int64 loan_id = 1;
  int64 lender_company_id = 2;
  int64 lender_employee_id = 3;
  repeated string file_types = 4;
  string category = 5;
}

message LoanDocumentCreateExtendTypeResponse {
  repeated LoanDocumentOptEntry  data = 1;
}
