syntax = "proto3";

package lender;

option go_package = "./lender";

message EmptyRequest {}

message EmptyResponse {}

message StringSliceResponse {
  repeated string data = 1;
}

message AddressEntity{
  string state = 1;
  string city = 2;
  string address1 = 3;
  string address2 = 4;
  string zip_code = 5;
}

message RangeInt64 {
  int64 min = 1;
  int64 max = 2;
}

message RangeInt32 {
  int32 min = 1;
  int32 max = 2;
}

message RangeFloat {
  float min = 1;
  float max = 2;
}


// ========================== common service start =================
message OptionRequest {
  OptionRequestData data = 1;
}

message OptionRequestData {
  string name = 1;
}

message OptionResponse {
  repeated OptionEntity data = 1;
}

message OptionEntity{
  string label = 1;
  string value = 2;
}

message UsCitiesRequest {
  UsCitiesRequestData data = 1;
}

message UsCitiesRequestData {
  string state_usps = 1;
}

service common {
  rpc GetOpt(OptionRequest) returns(OptionResponse);
  rpc GetUsState(EmptyRequest) returns(StringSliceResponse);
  rpc GetUsCities(UsCitiesRequest) returns(StringSliceResponse);
}
// ========================== common service end =================


// ================= user service start ==================
message UserEntity {
  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string mid_name = 4;
  string last_name = 5;
  string full_name = 6;
  string status = 7;
  string type = 8;
  string created_at = 9;
  string updated_at = 10;
}

// login -- request
message UserLoginRequest {
  UserLoginRequestData data = 1;
}

message UserLoginRequestData {
  string email = 1;
  string password = 2;
}
// login -- response
message UserJwtResponse {
  UserJwtResponseData data = 1;
}

message UserJwtResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// register -- request
message UserRegisterRequest {
  UserRegisterRequestData data = 1;
}

message UserRegisterRequestData {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string organization_name = 5;
}

// refresh -- request
message RefreshTokenRequest {
  RefreshTokenRequestData data = 1;
}

message RefreshTokenRequestData {
  string refresh_token = 1;
}

// verify email -- request
message VerifyEmailRequest {
  VerifyEmailRequestData data = 1;
}
message VerifyEmailRequestData {
  string email = 1;
  string code = 2;
}

// send verify email -- request
message SendVerifyEmailRequest {
  SendVerifyEmailRequestData data = 1;
}
message SendVerifyEmailResponse {
  EmptyResponse data = 1;
}
message SendVerifyEmailRequestData {
  string email = 1;
}

// reset password -- request
message ResetPasswordRequest {
  ResetPasswordRequestData data = 1;
}
message ResetPasswordResponse {
  UserJwtResponseData data = 1;
}

// send reset password email -- request
message SendResetPasswordEmailRequest {
  SendResetPasswordEmailRequestData data = 1;
}
// send reset password email -- response
message SendResetPasswordEmailResponse {
  EmptyResponse data = 1;
}
message SendResetPasswordEmailRequestData {
  string email = 1;
}

message ResetPasswordRequestData {
  string password = 1;
  string code = 2;
  string email = 3;
}

// userinfo -- request
message UserInfoRequest {
  UserInfoRequestData data = 1;
}

message UserInfoRequestData {
  int64 id = 1;
}
// userinfo -- response
message UserinfoResponse {
  UserinfoResponseData data = 1;
}

message UserinfoResponseData {
  message Organization {
    int64 id = 1;
    string name = 2;
    string status = 3;
    bool is_default = 4;
  }

  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string full_name = 5;
  int64 organization_id = 6;
  string organization_name = 7;
  string status = 8;
  repeated Organization organizations = 9;
  bool is_owner = 10;
  bool is_admin = 11;
  int64 organization_user_id = 12;
}
// switch organization -- request
message SwitchOrganizationRequest {
  SwitchOrganizationRequestData data = 1;
}
message SwitchOrganizationRequestData {
  int64 organization_id = 1;
}
// user service
service user {
  rpc Login(UserLoginRequest) returns(UserJwtResponse);
  rpc Register(UserRegisterRequest) returns(EmptyResponse);
  rpc RefreshToken(RefreshTokenRequest) returns(UserJwtResponse);
  rpc ResetPassword(ResetPasswordRequest) returns(UserJwtResponse);
  rpc SendResetPasswordEmail(SendResetPasswordEmailRequest) returns(SendResetPasswordEmailResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns(UserJwtResponse);
  rpc SendVerifyEmail(SendVerifyEmailRequest) returns(SendVerifyEmailResponse);
  rpc UserInfo(UserInfoRequest) returns(UserinfoResponse);
  rpc SwitchOrganization(SwitchOrganizationRequest) returns(UserJwtResponse);
}
// ================= user service end =================

// ================ loan service start =================
message LoanEntity {
  int64 id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntity loan_property = 8;
  string lender_company = 9;
  string closing_date = 10;
  double holdback_amount = 11;
  double holdback_released_amount = 12;
  float rate = 13;
  double closing_fund = 14;
  double principal_amount = 15;
  double monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  int32 prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  string created_at = 22;
  string updated_at = 23;
  int64 organization_id = 24;
  int64 borrower_id = 25;
  repeated string business_strategy = 26;
  repeated LoanApplicantEntity applicants = 27;
  string source = 28;
  int32 loan_term = 29;
  double ltv = 30;
  int32 est_credit_score = 31;
  double reserves_amount = 32;
  repeated LoanExperienceEntity transaction_experiences = 33;
  repeated LoanExperienceEntity real_estate_experiences = 34;
  LoanBorrowerEntity loan_borrower = 35;
  LoanDemographicEntity loan_demographic = 36;
  repeated LoanThirdServiceEntity loan_third_services = 37;
  string original_contract_date = 38;
  string extension_date = 39;
  string loan_processor = 40;
  LoanExtendValueEntity extend = 41;
  repeated LoanDocumentEntity loan_documents = 42;
  string code = 43;
}

message  LoanBudgetEntity {
  double original_budget = 1;
  double remaining_budget = 2;
  double cost_spent_to_date_amount = 3;
}

message BorrowerEditApplicantEntity {
  string name = 1 [deprecated = true];
  string type = 2;
  bool is_primary = 3;
  int64 id = 4;
  string first_name = 5;
  string last_name = 6;
  string mid_name = 7;
}

message LoanDetailRequest {
  LoanDetailRequestData data = 1;
}

message LoanDetailRequestData {
  int64 id = 1;
  int64 organization_id = 2;
}

message LoanDetailResponse {
  LoanEntity data = 1;
}

message LoanDeleteRequest {
  LoanDeleteRequestData data = 1;
}
message LoanDeleteRequestData {
  int64 id = 1;
  int64 organization_id = 2;
}

message LoanPageRequest {
  LoanPageRequestData data = 1;
}

message LoanPageResponse {
  LoanPageResponseData data = 1;
}

message  LoanPageRequestFilter {
  //  int64 organization_id = 1;
  string stage = 2;
  string keyword = 3;
  string keyword_type = 4;
  repeated string loan_purpose = 5;
  repeated string loan_type = 6;
  repeated string pending_status = 7;
}

message  LoanPageRequestSorter {
  string column = 1;
  string sort = 2;
}

message LoanPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  LoanPageRequestFilter filter = 3;
  LoanPageRequestSorter sorter = 4;
}

message LoanPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated LoanEntity list = 5;
}


message LoanUpdateRequest {
  LoanUpdateRequestData data = 1;
}
message LoanUpdateRequestData {
  string loan_purpose = 1;
  string loan_type = 2;
  double total_amount = 3;
  double initial_amount = 4;
  LoanPropertyEditEntity loan_property = 5;
  double holdback_amount = 6;
  double principal_amount = 7;
  int32 prepayment_penalty = 9;
  //  int64 organization_id = 10;
  repeated string business_strategy = 11;
  repeated LoanApplicantLoanEditEntity applicants = 12;
  int32 loan_term = 13;
  //  double ltv = 14;
  int32 est_credit_score = 15;
  double reserves_amount = 16;
  repeated LoanExperienceEntity transaction_experiences = 17;
  repeated LoanExperienceEntity real_estate_experiences = 18;
  LoanDemographicEntity loan_demographic = 19;
  repeated LoanThirdServiceEntity loan_third_services = 20;
  int64 id = 21;
  //  int64 user_id = 22;
  string stage = 23;
  string pending_status = 24;
}

message LoanUpdateResponse {
  LoanUpdateResponseData data = 1;
}
message LoanUpdateResponseData {
  int64 id = 1;
}

message LoanExtendValueEntity {
  string  pricing = 1;
  string loan_status_updates = 2;
  string meeting_notes = 3;
  string action_list = 4;
  string business_line = 5;
}

// update documents
message LoanUpdateDocumentsRequest {
  LoanUpdateDocumentsRequestData data = 1;
}
message LoanUpdateDocumentsRequestData {
  int64 id = 1;
  int64 borrower_id = 2;
  repeated FileEntity documents = 3;
}

// update stage
message LoanUpdateStageRequest {
  LoanUpdateStageRequestData data = 1;
}
message LoanUpdateStageRequestData {
  int64 id = 1;
  //  int64 user_id = 2;
  //  int64 organization_id = 3;
  string stage = 4;
}

// update pending status
message LoanUpdatePendingStatusRequest {
  LoanUpdatePendingStatusRequestData data = 1;
}
message LoanUpdatePendingStatusRequestData {
  int64 id = 1;
  //  int64 user_id = 2;
  //  int64 organization_id = 3;
  string pending_status = 4;
}
// pending status review
message LoanPendingStatusReviewRequest {
  LoanPendingStatusReviewRequestData data = 1;
}
message LoanPendingStatusReviewRequestData {
  int64 id = 1;
  int64 user_id = 2;
  int64 organization_id = 3;
  string current_pending_status = 4;
  string action = 5;
  string comment = 6;
}

// loan document opts
message LoanDocumentOptsRequest {
  LoanDocumentOptsRequestData data = 1;
}
message LoanDocumentOptsRequestData {
  int64 id = 1;
}

message LoanDocumentOptsResponse {
  repeated LoanDocumentOptEntity data = 1;
}

service Loan {
  rpc LoanDetail(LoanDetailRequest) returns(LoanDetailResponse);
  rpc LoanPage(LoanPageRequest) returns(LoanPageResponse);
  rpc UpdateLoan(LoanUpdateRequest) returns(LoanUpdateResponse);
  rpc UpdateLoanDocuments(LoanUpdateDocumentsRequest) returns(EmptyResponse);
  rpc UpdateLoanStage(LoanUpdateStageRequest) returns(EmptyResponse);
  rpc UpdateLoanPendingStatus(LoanUpdatePendingStatusRequest) returns(EmptyResponse);
  rpc PendingStatusReview(LoanPendingStatusReviewRequest) returns(EmptyResponse);
  rpc LoanDocumentOpts(LoanDocumentOptsRequest) returns(LoanDocumentOptsResponse);
}
// ===================== loan service end ======================

