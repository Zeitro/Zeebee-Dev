// ================= organization service start =================
message OrganizationEntity {
  int64 id = 1;
  string name = 2;
  string status = 3;
  int64 owner_id = 4;
  AddressEntity address = 5;
  string contact_email = 6;
  string contact_phone = 7;
  string contact_name = 8;
  string owner_type = 9;
  string type = 10;
  string created_at = 11;
  string updated_at = 12;
  repeated OrganizationEmailEntity organization_emails = 13;
  string logo = 14;
  string website = 15;
  string tagline = 16;
  OrganizationMetadataEntity metadata = 17;
  UserEntity owner = 18;
}

message OrganizationMetadataEntity {
  OrganizationLenderMetadataEntity lender = 1;

}

message OrganizationLenderMetadataEntity {
  RangeFloat loan_amount_range = 1;
  RangeInt32       loan_term_range = 2;
  RangeFloat       loan_tate_range = 3;
  RangeFloat       loan_point_range = 4;
}
// update profile --  request
message OrganizationUpdateProfileRequest {
  OrganizationUpdateProfileRequestData data = 1;
}
message OrganizationUpdateProfileRequestData {
  string contact_email = 1;
  string contact_phone = 2;
  string contact_name = 3;
  string logo = 4;
  string website = 5;
  string tagline = 6;
  OrganizationLenderMetadataEntity lender_metadata = 7;
}

// create organization --  request
message OrganizationCreateRequest {
  OrganizationCreateRequestData data = 1;
}
message OrganizationCreateRequestData {
  string name = 1;
  string contact_email = 5;
  string contact_phone = 6;
  string contact_name = 7;
  string owner_type = 8;
  string type = 9;
  string logo = 10;
  string website = 11;
  string tagline = 12;
  OrganizationLenderMetadataEntity lender_metadata = 13;
}
// create organization --  response
message OrganizationCreateResponse {
  OrganizationEntity data = 1;
}

service Organization {
  rpc Profile(EmptyRequest) returns(OrganizationEntity);
  rpc UpdateProfile(OrganizationUpdateProfileRequest) returns(OrganizationEntity);
  rpc Create(OrganizationCreateRequest) returns(OrganizationCreateResponse);
}

