RpcConf:
  Name: tenant.rpc
  ListenOn: 0.0.0.0:10401
  Mode: dev
  # Dev: direct connect (no Etcd). Backends reach tenant via RpcConf.Endpoints tenant:10401.

  DbConf:
    dsn: "host=127.0.0.1 user=dev_user password=dev_password dbname=zeebee_dev port=5432 sslmode=disable TimeZone=UTC"

  RedisConf:
    Host: 127.0.0.1:6379
    Type: node
    Prefix: tenant

  LimiterConf:
    Login:             { Rate: 10, Period: 300, LockPeriod: 120 }
    SendLoginEmail:    { Rate: 5, Period: 300 }
    SendVerifyEmail:   { Rate: 5, Period: 300 }
    SendResetPwdEmail: { Rate: 5, Period: 300 }

  CasbinConf:
    ModelPath: etc/model.conf
    Watcher:
      Host: 127.0.0.1:6379
      Pwd: ""
      Channel: /tenant-channel
      Tls: false

  # Per-platform config. JwtAuth secrets MUST match each backend's JwtAuth so that
  # backend validates tenant-issued tokens locally. Values mirror each platform's
  # config-local.yaml during the coexistence period (ODD-5).
