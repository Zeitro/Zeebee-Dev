syntax = "proto3";

package tenant;

option go_package = "zeebee-backend/app/tenant/rpc/pb/tenant";

import "proto/auth.proto";

// Authorization execution (direction B): per-request real-time decision.
// tenant is the sole Casbin executor. Token signature verified locally at each backend.
// Request/response shape intentionally matches the existing proto.AuthCheck so backends
// switch to tenant.AuthzCheck with no payload change.

service Auth {
  rpc AuthCheck(proto.AuthCheckRequest) returns (proto.AuthCheckResponse);
}
