syntax = "proto3";

package admin;

option go_package = "zeebee-backend/app/admin/rpc/pb/admin";

import "proto/common.proto";
import "proto/entity.proto";


message OrganizationUserPageEntity {
  int64 id = 1;
  string status = 2;
  string first_name = 3;
  string mid_name = 4;
  string last_name = 5;
  string full_name = 6;
  string phone = 7;
  string remark = 8;
  string created_at = 9;
  string updated_at = 10;
  string email = 11;
  repeated proto.RoleEntity roles = 12;
  bool is_owner = 13;
}
// page --  request
message OrganizationUserPageRequest {
  OrganizationUserPageRequestData data = 1;
}
message OrganizationUserPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  OrganizationUserPageRequestFilter filter = 3;
  OrganizationUserPageRequestSorter sorter = 4;

}
message OrganizationUserPageRequestFilter {
  string keyword = 1;
}

message OrganizationUserPageRequestSorter {
  string column = 1;
  string sort = 2;
}
// page --  response
message OrganizationUserPageResponse {
  OrganizationUserPageResponseData data = 1;
}
message OrganizationUserPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated OrganizationUserPageEntity list = 5;
}
// create -- request
message OrganizationUserCreateRequest {
  OrganizationUserCreateRequestData data = 1;
}
message OrganizationUserCreateRequestData {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  repeated int64 role_ids = 6;
}
// update -- request
message OrganizationUserUpdateRequest {
  OrganizationUserUpdateRequestData data = 1;
}
message OrganizationUserUpdateRequestData {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string phone = 5;
  repeated int64 role_ids = 6;
}


// delete -- request
message OrganizationUserDeleteRequest {
  OrganizationUserDeleteRequestData data = 1;
}

message OrganizationUserDeleteRequestData {
  int64 id = 1;
}

// detail -- request
message OrganizationUserDetailRequest {
  OrganizationUserDetailRequestData data = 1;
}
message OrganizationUserDetailRequestData {
  int64 id = 1;
}
// detail -- response
message OrganizationUserDetailResponse {
  proto.OrganizationUserEntity data = 1;
}

// switch status -- request
message OrganizationUserSwitchStatusRequest {
  OrganizationUserSwitchStatusRequestData data = 1;
}
message OrganizationUserSwitchStatusRequestData {
  int64 id = 1;
  string status = 4;
}

service OrganizationUser {
  rpc Page(OrganizationUserPageRequest) returns(OrganizationUserPageResponse);
  rpc Create(OrganizationUserCreateRequest) returns(OrganizationUserDetailResponse);
  rpc Update(OrganizationUserUpdateRequest) returns(OrganizationUserDetailResponse);
  rpc Delete(OrganizationUserDeleteRequest) returns(proto.EmptyResponse);
  rpc Detail(OrganizationUserDetailRequest) returns(OrganizationUserDetailResponse);
  rpc SwitchStatus(OrganizationUserSwitchStatusRequest) returns(proto.EmptyResponse);
}
