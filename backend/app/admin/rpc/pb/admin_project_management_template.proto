syntax = "proto3";

package admin;

option go_package = "zeebee-backend/app/admin/rpc/pb/admin";

import "proto/common.proto";
import "proto/entity.proto";
import "admin_project_management_stage.proto";

message ProjectManagementTemplatePageRequest {
  ProjectManagementTemplatePageRequestData data = 1;
}
message ProjectManagementTemplatePageRequestData {
  int64 page = 1;
  int64 limit = 2;
  ProjectManagementTemplatePageRequestFilter filter = 3;
  proto.CommonPageSorter sorter = 4;
}
message ProjectManagementTemplatePageRequestFilter {
  string keyword = 1;
  string status = 2;
}

message ProjectManagementTemplatePageResponse {
  int64 total = 1;
  int64 page = 2;
  int64 limit = 3;
  int64 total_page = 4;
  repeated proto.ProjectManagementTemplateEntity list = 5;
}

message ProjectManagementTemplateCreateRequest {
  ProjectManagementTemplateCreateRequestData data = 1;
}
message ProjectManagementTemplateCreateRequestData {
  string name = 1;
  string description = 2;
  string status = 3;
  string project_type = 4;
  string start_at = 5;
  int64 period_value = 6;
  string period_unit = 7;
  optional int32 sort_order = 8;
  string end_at = 9;
}

message ProjectManagementTemplateUpdateRequest {
  ProjectManagementTemplateUpdateRequestData data = 1;
}
message ProjectManagementTemplateUpdateRequestData {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  optional int32 sort_order = 5;
  string project_type = 6;
  string start_at = 7;
  string end_at = 8;
  int64 period_value = 9;
  string period_unit = 10;
  repeated ProjectManagementStageInput stages = 11;
}

message ProjectManagementTemplateStatusRequest {
  ProjectManagementTemplateStatusRequestData data = 1;
}
message ProjectManagementTemplateStatusRequestData {
  int64 id = 1;
  string status = 2;
}

message ProjectManagementTemplateDetailRequest {
  ProjectManagementTemplateDetailRequestData data = 1;
}
message ProjectManagementTemplateDetailRequestData {
  int64 id = 1;
}

message ProjectManagementTemplateDetailResponse {
  proto.ProjectManagementTemplateEntity data = 1;
}

service ProjectManagementTemplate {
  rpc Page(ProjectManagementTemplatePageRequest) returns(ProjectManagementTemplatePageResponse);
  rpc Create(ProjectManagementTemplateCreateRequest) returns(ProjectManagementTemplateDetailResponse);
  rpc Update(ProjectManagementTemplateUpdateRequest) returns(ProjectManagementTemplateDetailResponse);
	  rpc Delete(proto.PathIdRequest) returns(proto.EmptyResponse);
  rpc Status(ProjectManagementTemplateStatusRequest) returns(ProjectManagementTemplateDetailResponse);
  rpc Defaults(proto.PathIdRequest) returns(proto.EmptyResponse);
  rpc Detail(ProjectManagementTemplateDetailRequest) returns(ProjectManagementTemplateDetailResponse);
}
