syntax = "proto3";

package admin;

option go_package = "zeebee-backend/app/admin/rpc/pb/admin";

import "proto/common.proto";
import "proto/entity.proto";

message ProjectManagementWorkflowResponse {
  repeated proto.ProjectManagementWorkflowEntity list = 1;
}
message ProjectManagementWorkflowDetailResponse {
  proto.ProjectManagementWorkflowEntity data = 1;
}

message ProjectManagementWorkflowCreateRequest {
  ProjectManagementWorkflowCreateRequestData data = 1;
}
message ProjectManagementWorkflowCreateRequestData {
  int64 template_id = 1;
  string name = 2;
  string description = 3;
  repeated ProjectManagementWorkflowTransitionInput transitions = 4;
}

message ProjectManagementWorkflowUpdateRequest {
  ProjectManagementWorkflowUpdateRequestData data = 1;
}
message ProjectManagementWorkflowUpdateRequestData {
  int64 template_id = 1;
  int64 id = 2;
  string name = 3;
  string description = 4;
  repeated ProjectManagementWorkflowTransitionInput transitions = 5;
}

message ProjectManagementWorkflowDetailRequest {
  ProjectManagementWorkflowDetailRequestData data = 1;
}
message ProjectManagementWorkflowDetailRequestData {
  int64 template_id = 1;
  int64 id = 2;
}

message ProjectManagementWorkflowTransitionInput {
  string name = 1;
  int64 from_stage_id = 2;
  int64 to_stage_id = 3;
  repeated string allowed_actor_types = 4;
  int64 id = 5;
}
message ProjectManagementWorkflowDeleteRequest {
  ProjectManagementWorkflowDeleteRequestData data = 1;
}
message ProjectManagementWorkflowDeleteRequestData {
  int64 template_id = 1;
  int64 id = 2;
}

message ProjectManagementWorkflowDefaultRequest {
  ProjectManagementWorkflowDefaultRequestData data = 1;
}
message ProjectManagementWorkflowDefaultRequestData {
  int64 template_id = 1;
  int64 id = 2;
}

service ProjectManagementWorkflow {
  rpc Workflows(proto.PathIdRequest) returns(ProjectManagementWorkflowResponse);
  rpc Create(ProjectManagementWorkflowCreateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc Detail(ProjectManagementWorkflowDetailRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc Update(ProjectManagementWorkflowUpdateRequest) returns(ProjectManagementWorkflowDetailResponse);
  rpc Delete(ProjectManagementWorkflowDeleteRequest) returns(proto.EmptyResponse);
  rpc Default(ProjectManagementWorkflowDefaultRequest) returns(proto.EmptyResponse);
}
