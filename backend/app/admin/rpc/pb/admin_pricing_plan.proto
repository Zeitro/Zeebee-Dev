syntax = "proto3";

package admin;

option go_package = "zeebee-backend/app/admin/rpc/pb/admin";

import "proto/common.proto";
import "proto/entity.proto";



message PricingPlanPageEntity {
  int64 id = 1;
  string name = 2;
  string subtitle = 3;
  string status = 4;
  int32 trial_days = 5;
  int32 sort_order = 6;
  bool is_public = 7;
  string type = 8;
  string plan_type = 9;
  string created_at = 10;
  string updated_at = 11;
  bool is_default = 12;
  repeated proto.PricingPlanPolicyEntity policies = 13;
}


// PricingPlan Create
message PricingPlanCreateRequest {
  PricingPlanCreateRequestData data = 1;
}
message PricingPlanCreateRequestData {
  string name = 1;
  string subtitle = 2;
  string description = 3;
  //  string status = 4;
  int32 trial_days = 5;
  int32 sort_order = 6;
  bool is_public = 7;
  string type = 8;
  string plan_type = 9;
  bool is_default = 10;
}

// PricingPlan Update
message PricingPlanUpdateRequest {
  PricingPlanUpdateRequestData data = 1;
}
message PricingPlanUpdateRequestData {
  int64 id = 1;
  string subtitle = 2;
  string description = 3;
  //  string status = 4;
  int32 trial_days = 5;
  int32 sort_order = 6;
  bool is_public = 7;
  string plan_type = 8;
  bool is_default = 9;
}

// PricingPlan Delete
message PricingPlanDeleteRequest {
  PricingPlanDeleteRequestData data = 1;
}
message PricingPlanDeleteRequestData {
  int64 id = 1;
}

// PricingPlan Detail
message PricingPlanDetailRequest {
  PricingPlanDetailRequestData data = 1;
}
message PricingPlanDetailRequestData {
  int64 id = 1;
}
message PricingPlanDetailResponse {
  proto.PricingPlanEntity data = 1;
}

// PricingPlan Page
message PricingPlanPageRequest {
  PricingPlanPageRequestData data = 1;
}
message PricingPlanPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  PricingPlanPageRequestFilter filter = 3;
  PricingPlanPageRequestSorter sorter = 4;
}
message PricingPlanPageRequestFilter {
  string keyword = 1;
  string status = 2;
  string type = 3;
  string plan_type = 4;
}
message PricingPlanPageRequestSorter {
  string column = 1;
  string sort = 2;
}
message PricingPlanPageResponse {
  PricingPlanPageResponseData data = 1;
}
message PricingPlanPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated PricingPlanPageEntity list = 5;
}

// PricingPlan SwitchStatus
message PricingPlanSwitchStatusRequest {
  PricingPlanSwitchStatusRequestData data = 1;
}
message PricingPlanSwitchStatusRequestData {
  int64 id = 1;
  string status = 2;
}

// PricingPlan BindResources
message PricingPlanBindResourcesRequest {
  PricingPlanBindResourcesRequestData data = 1;
}
message PricingPlanBindResourcesRequestData {
  int64 id = 1;
  repeated int64 resource_ids = 2;
}
message PricingPlanBindResourcesResponse {
  repeated proto.ResourceTreeEntity data = 1;
}

// PricingPlan ResourceList
message PricingPlanResourceListRequest {
  PricingPlanResourceListRequestData data = 1;
}
message PricingPlanResourceListRequestData {
  int64 id = 1;
}
message PricingPlanResourceListResponse {
  repeated proto.ResourceTreeEntity data = 1;
}

// all
message PricingPlanAllRequest {
  PricingPlanAllRequestData data = 1;
}
message PricingPlanAllRequestData {
  string type = 1;
}
message PricingPlanAllResponse {
  repeated proto.PricingPlanEntity data = 1;
}



service PricingPlan {
  rpc Create(PricingPlanCreateRequest) returns(PricingPlanDetailResponse);
  rpc Update(PricingPlanUpdateRequest) returns(PricingPlanDetailResponse);
  rpc Delete(proto.PathIdRequest) returns(proto.EmptyResponse);
  rpc Detail(proto.PathIdRequest) returns(PricingPlanDetailResponse);
  rpc Page(PricingPlanPageRequest) returns(PricingPlanPageResponse);
  rpc SwitchStatus(PricingPlanSwitchStatusRequest) returns(proto.EmptyResponse);
  rpc BindResources(PricingPlanBindResourcesRequest) returns(proto.EmptyResponse);
  rpc ResourceList(PricingPlanResourceListRequest) returns(PricingPlanResourceListResponse);
  rpc All(PricingPlanAllRequest) returns(PricingPlanAllResponse);
}
