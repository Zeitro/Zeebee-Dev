service organization {
  rpc Page(OrganizationPageRequest) returns(OrganizationPageResponse);
  rpc CreateLender(OrganizationCreateLenderRequest) returns(OrganizationDetailResponse);
  rpc UpdateLender(OrganizationUpdateLenderRequest) returns(OrganizationDetailResponse);
  rpc Detail(IdRequest) returns(OrganizationDetailResponse);
  rpc Delete(IdRequest) returns(EmptyResponse);
  rpc SwitchStatus(OrganizationSwitchStatusRequest) returns(EmptyResponse);
  rpc SelectOptions(OrganizationSelectOptionsRequest) returns(OrganizationSelectOptionsResponse);
  //  rpc AllLender(EmptyRequest) returns(OrganizationSelectOptionsResponse);
