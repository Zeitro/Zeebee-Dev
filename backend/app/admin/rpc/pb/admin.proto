// reset password
message ResetPasswordRequest {
  ResetPasswordRequestData data = 1;
}
message ResetPasswordResponse {
  UserLoginResponseData data = 1;
}

// send reset password email
//message SendResetPasswordEmailRequest {
//  SendResetPasswordEmailRequestData data = 1;
//}
//message SendResetPasswordEmailResponse {
//  EmptyResponse data = 1;
//}
//message SendResetPasswordEmailRequestData {
//  string email = 1;
