// ================= storage service end =================
// ========================== common service start =================
message OptionRequest {
  OptionRequestData data = 1;
}

message OptionRequestData {
  string name = 1;
}

message OptionResponse {
  repeated OptionEntity data = 1;
}

message OptionEntity{
  string label = 1;
  string value = 2;
}

message UsCitiesRequest {
  UsCitiesRequestData data = 1;
}

message UsCitiesRequestData {
  string state_usps = 1;
}

service common {
  rpc GetOpt(OptionRequest) returns(OptionResponse);
  rpc GetUsState(EmptyRequest) returns(StringSliceResponse);
  rpc GetUsCities(UsCitiesRequest) returns(StringSliceResponse);
}
// ========================== common service end =================

// ========================== base template service start =================
// Template variable entity for JSONB variable_group_schema field
message TemplateVariableEntity {
  string label = 1;
  string type = 2;           // String, Array, Object
  string key = 3;
  bool is_editable = 4;
  string source = 5;         // Fixed, Dynamic,Template
  string fixed_value = 6;
  map<string, TemplateVariableEntity> properties = 8;  // for object type
  repeated TemplateVariableEntity items = 9;            // for array type
  string format = 10;
}

// Template variable group entity
message TemplateVariableGroupEntity {
  string name = 1;
  repeated TemplateVariableEntity variables = 2;
}

// Base template entity
message BaseTemplateEntity {
  int64 id = 1;
  string name = 2;
  string type = 3;           // Borrower, Lender
  string category = 4;       // Email, Contract
  string purpose = 5;
  string content = 6;
  repeated TemplateVariableGroupEntity variable_group_schema = 7;
  string status = 8;         // Active, Disabled
  string description = 9;
  string created_at = 10;
  string updated_at = 11;
  string example_variables = 12;
  string scope = 13; // System, Organization
}

// Base template page entity (for list display)
message BaseTemplatePageEntity {
  int64 id = 1;
  string name = 2;
  string type = 3;
  string category = 4;
  string purpose = 5;
  string status = 6;
  string description = 7;
  string created_at = 8;
  string updated_at = 9;
  string scope = 10;
}

// Create ---- request
message CreateBaseTemplateRequest {
  CreateBaseTemplateRequestData data = 1;
}
message CreateBaseTemplateRequestData {
  string name = 1;
  string type = 2;
  string category = 3;
  string purpose = 4;
  string content = 5;
  repeated TemplateVariableGroupEntity variable_group_schema = 6;
  string description = 7;
  string example_variables = 8;
  string scope = 9;
}
// Create ---- response
message CreateBaseTemplateResponse {
  BaseTemplateEntity data = 1;
}

// Update ---- request
message UpdateBaseTemplateRequest {
  UpdateBaseTemplateRequestData data = 1;
}
message UpdateBaseTemplateRequestData {
  int64 id = 1;
  string name = 2;
  string category = 4;
  string content = 6;
  repeated TemplateVariableGroupEntity variable_group_schema = 7;
  string description = 8;
  string example_variables = 9;
  string scope = 10;
}
// Update ---- response
message UpdateBaseTemplateResponse {
  BaseTemplateEntity data = 1;
}

// detail ---- request
message GetBaseTemplateRequest {
  IdRequest data = 1;
}
// detail ---- response
message GetBaseTemplateResponse {
  BaseTemplateEntity data = 1;
}

// Page ---- request
message BaseTemplatePageRequest {
  BaseTemplatePageRequestData data = 1;
}
message BaseTemplatePageRequestData {
  int64 page = 1;
  int64 limit = 2;
  BaseTemplatePageRequestFilter filter = 3;
  BaseTemplatePageRequestSorter sorter = 4;
}
message BaseTemplatePageRequestFilter {
  string keyword = 1;
  string type = 2;
  string category = 3;
  string status = 4;
  string scope = 5;
}
message BaseTemplatePageRequestSorter {
  string column = 1;
  string sort = 2;
}
// Page ---- response
message BaseTemplatePageResponse {
  BaseTemplatePageResponseData data = 1;
}
message BaseTemplatePageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated BaseTemplatePageEntity list = 5;
}

// Switch ---- request
message SwitchBaseTemplateStatusRequest {
  SwitchBaseTemplateStatusRequestData data = 1;
}
message SwitchBaseTemplateStatusRequestData {
  int64 id = 1;
  string status = 2;
}

// Delete ---- request
message DeleteBaseTemplateRequest {
  IdRequest data = 1;
}

// preview ---- request
message BaseTemplatePreviewRequest {
  BaseTemplatePreviewRequestData data = 1;
}
message BaseTemplatePreviewRequestData {
  string content = 1;
  repeated TemplateVariableGroupEntity variable_group_schema = 2;
  string example_variables = 3;
  string name = 4;
}
// preview ---- response
message BaseTemplatePreviewResponse {
  BaseTemplatePreviewResponseData data = 1;
}
message BaseTemplatePreviewResponseData {
  string content = 1;
}

service BaseTemplate {
  rpc Create(CreateBaseTemplateRequest) returns(CreateBaseTemplateResponse);
  rpc Update(UpdateBaseTemplateRequest) returns(UpdateBaseTemplateResponse);
  rpc Detail(GetBaseTemplateRequest) returns(GetBaseTemplateResponse);
  rpc Page(BaseTemplatePageRequest) returns(BaseTemplatePageResponse);
  rpc SwitchStatus(SwitchBaseTemplateStatusRequest) returns(EmptyResponse);
  rpc Delete(DeleteBaseTemplateRequest) returns(EmptyResponse);
  rpc Preview(BaseTemplatePreviewRequest) returns(BaseTemplatePreviewResponse);
}
// ========================== base template service end =================