syntax = "proto3";

package admin;

option go_package = "./admin";

message EmptyRequest {}

message EmptyResponse {}

message StringSliceResponse {
  repeated string data = 1;
}

message AddressEntry{
  string state = 1;
  string city = 2;
  string address1 = 3;
  string address2 = 4;
  string zip_code = 5;
}

// ================= user service start ==================
// login
message UserLoginRequest {
  UserLoginRequestData data = 1;
}
message UserLoginResponse {
  UserLoginResponseData data = 1;
}

message UserLoginRequestData {
  string email = 1;
  string password = 2;
}

message UserLoginResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// refresh
message RefreshTokenRequest {
  RefreshTokenRequestData data = 1;
}

message RefreshTokenRequestData {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  RefreshTokenResponseData data = 1;
}

message RefreshTokenResponseData {
  string access_token = 1;
  int64 access_token_expire = 2;
}

// reset password
message ResetPasswordRequest {
  ResetPasswordRequestData data = 1;
}
message ResetPasswordResponse {
  UserLoginResponseData data = 1;
}

message ResetPasswordRequestData {
  string password = 1;
  string code = 2;
  string email = 3;
}
message ResetPasswordResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// userinfo
message UserInfoRequest {
  UserInfoRequestData data = 1;
}

message UserInfoRequestData {
  int64 id = 1;
}

message UserinfoResponse {
  UserinfoResponseData data = 1;
}

message UserinfoResponseData {
  message Organization {
    int64 id = 1;
    string name = 2;
    string status = 3;
    bool is_default = 4;
  }

  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string full_name = 5;
  int64 organization_id = 6;
  string organization_name = 7;
  string status = 8;
  repeated Organization organizations = 9;
}

// edit profile
message UserProfileEditRequest {
  UserProfileEditRequestData data = 1;
}
message UserProfileEditRequestData {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
}

service user {
  // user
  rpc Login(UserLoginRequest) returns(UserLoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns(RefreshTokenResponse);
  rpc UserInfo(UserInfoRequest) returns(UserinfoResponse);
  rpc ResetPassword(ResetPasswordRequest) returns(ResetPasswordResponse);
  rpc EditProfile(UserProfileEditRequest) returns(UserinfoResponse);
}
// ================= user service end =================

// ================= api service start =================
message ApiTreeEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  string path = 4;
  string method = 5;
  string status = 6;
  string description = 7;
  string type = 8;
  int32  sort_order = 9;
  string created_at = 10;
  string updated_at = 11;
  repeated ApiTreeEntity children = 12;
}

message ApiEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  string path = 4;
  string method = 5;
  string status = 6;
  string description = 7;
  string type = 8;
  int32  sort_order = 9;
  string created_at = 10;
  string updated_at = 11;
}

// api tree
message ApiTreeRequest {
  ApiTreeRequestData data = 1;
}
message ApiTreeRequestData {
  int64 user_id = 1;
  int64 organization_id = 2;
  string type = 3;
}

message ApiTreeResponse {
  repeated ApiTreeEntity data = 1;
}
// create
message ApiCreateRequest {
  ApiCreateRequestData data = 1;
}
message ApiCreateRequestData {
  int64 parent_id = 1;
  string type = 2;
  string name = 3;
  string path = 4;
  string method = 5;
  string description = 6;
  string status = 7;
  int32 sort_order = 8;
  int64 user_id = 9;
  int64 organization_id = 10;
}
message ApiCreateResponse {
  ApiTreeEntity data = 1;
}
// update
message ApiUpdateRequest {
  ApiUpdateRequestData data = 1;
}
message ApiUpdateRequestData {
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string name = 4;
  string path = 5;
  string method = 6;
  string description = 7;
  string status = 8;
  int32 sort_order = 9;
  int64 user_id = 10;
  int64 organization_id = 11;
}

//  delete
message ApiDeleteRequest {
  ApiDeleteRequestData data = 1;
}
message ApiDeleteRequestData {
  int64 id = 1;
  int64 user_id = 2;
  int64 organization_id = 3;
  string type = 4;
}
// detail
message ApiDetailRequest {
  ApiDetailRequestData data = 1;
}
message ApiDetailRequestData {
  int64 id = 1;
  int64 user_id = 2;
  int64 organization_id = 3;
  string type = 4;
}

service api {
  rpc ApiTree(ApiTreeRequest) returns(ApiTreeResponse);
  rpc Create(ApiCreateRequest) returns(ApiCreateResponse);
  rpc Update(ApiUpdateRequest) returns(ApiCreateResponse);
  rpc Delete(ApiDeleteRequest) returns(EmptyResponse);
  rpc Detail(ApiDetailRequest) returns(ApiCreateResponse);
}
// =================== api service end =================

// ================= resource service start =================
message ResourceTreeEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string resource_type = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  string tag = 8;
  bool is_show = 9;
  string status = 10;
  int32  sort_order = 11;
  string created_at = 12;
  string updated_at = 13;
  repeated ResourceTreeEntity children = 14;
}

message ResourceEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string resource_type = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  string tag = 8;
  bool is_show = 9;
  string status = 10;
  int32  sort_order = 11;
  string created_at = 12;
  string updated_at = 13;
  repeated ApiEntity apis = 14;
  string pivot_role_data_scope = 15;
}

// resource tree
message ResourceTreeRequest {
  ResourceTreeRequestData data = 1;
}
message ResourceTreeRequestData {
  int64 user_id = 1;
  int64 organization_id = 2;
  string type = 3;
}

message ResourceTreeResponse {
  repeated ResourceTreeEntity data = 1;
}
// create
message ResourceCreateRequest {
  ResourceCreateRequestData data = 1;
}
message ResourceCreateRequestData {
  int64 parent_id = 1;
  string type = 2;
  string resource_type = 3;
  string name = 4;
  string path = 5;
  string icon = 6;
  string tag = 7;
  bool is_show = 8;
  string status = 9;
  int32 sort_order = 10;
  int64 user_id = 11;
  int64 organization_id = 12;
  repeated int64 api_ids = 13;
}
message ResourceCreateResponse {
  ResourceTreeEntity data = 1;
}
// update
message ResourceUpdateRequest {
  ResourceUpdateRequestData data = 1;
}
message ResourceUpdateRequestData {
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string resource_type = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  string tag = 8;
  bool is_show = 9;
  string status = 10;
  int32 sort_order = 11;
  int64 user_id = 12;
  int64 organization_id = 13;
  repeated int64 api_ids = 14;
}

//  delete
message ResourceDeleteRequest {
  ResourceDeleteRequestData data = 1;
}
message ResourceDeleteRequestData {
  int64 id = 1;
  int64 user_id = 2;
  int64 organization_id = 3;
  string type = 4;
}
// detail
message ResourceDetailRequest {
  ResourceDetailRequestData data = 1;
}
message ResourceDetailRequestData {
  int64 id = 1;
  int64 user_id = 2;
  int64 organization_id = 3;
  string type = 4;
}

message ResourceDetailResponse {
  ResourceEntity data = 1;
}


service resource {
  rpc ResourceTree(ResourceTreeRequest) returns(ResourceTreeResponse);
  rpc Create(ResourceCreateRequest) returns(ResourceDetailResponse);
  rpc Update(ResourceUpdateRequest) returns(ResourceDetailResponse);
  rpc Delete(ResourceDeleteRequest) returns(EmptyResponse);
  rpc Detail(ResourceDetailRequest) returns(ResourceDetailResponse);
}
// =================== resource service end =================
// ================= role service start =================
message RoleEntity {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string type = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
  int64 organization_id = 8;
  repeated ResourceEntity resources = 9;
}

message RolePageRequest {
  RolePageRequestData data = 1;
}
message RolePageRequestData {
  int64 page = 1;
  int64 limit = 2;
  RolePageRequestFilter filter = 3;
  RolePageRequestSorter sorter = 4;
}
message RolePageRequestFilter {
  int64 user_id = 1;
  string keyword = 2;
  int64 organization_id = 3;
}
message RolePageRequestSorter {
  string column = 1;
  string sort = 2;
}

message RolePageResponse {
  RolePageResponseData data = 1;
}

message RolePageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated RoleEntity list = 5;
}

//  create
message RoleCreateRequest {
  RoleCreateRequestData data = 1;
}
message RoleCreateRequestData {
  string name = 1;
  string description = 2;
  string status = 4;
  int64 user_id = 5;
  int64 organization_id = 6;
  repeated RoleAndResourceRelationEntity role_and_resources = 7;
}
message RoleCreateResponse {
  RoleEntity data = 1;
}
//  update
message RoleUpdateRequest {
  RoleUpdateRequestData data = 1;
}
message RoleUpdateRequestData {
  int64 id = 1;
  string name = 2;
  string description = 3;
  //  string type = 4;
  string status = 5;
  int64 user_id = 6;
  int64 organization_id = 7;
  repeated RoleAndResourceRelationEntity role_and_resources = 8;
}

message RoleAndResourceRelationEntity{
  int64 role_id = 1;
  int64 resource_id = 2;
  string data_scope = 3;
}


message RoleUpdateResponse {
  RoleEntity data = 1;
}
//  delete
message RoleDeleteRequest {
  RoleDeleteRequestData data = 1;
}
message RoleDeleteRequestData {
  int64 id = 1;
  int64 user_id = 2;
  int64 organization_id = 3;
  //  string type = 4;
}

//  detail
message RoleDetailRequest {
  RoleDetailRequestData data = 1;
}
message RoleDetailRequestData {
  int64 id = 1;
  int64 user_id = 2;
  int64 organization_id = 3;
  //  string type = 4;
}
message RoleDetailResponse {
  RoleEntity data = 1;
}
// update status
message RoleUpdateStatusRequest {
  RoleUpdateStatusRequestData data = 1;
}
message RoleUpdateStatusRequestData {
  int64 id = 1;
  string status = 2;
  int64 user_id = 3;
  int64 organization_id = 4;
  //  string type = 5;
}

// all roles
message RoleAllRequest {
  RoleAllRequestData data = 1;
}
message RoleAllRequestData {
  int64 user_id = 1;
  int64 organization_id = 2;
}
message RoleAllResponse {
  repeated RoleEntity data = 1;
}

service role {
  rpc Page(RolePageRequest) returns(RolePageResponse);
  rpc Create(RoleCreateRequest) returns(RoleCreateResponse);
  rpc Update(RoleUpdateRequest) returns(RoleUpdateResponse);
  rpc Delete(RoleDeleteRequest) returns(EmptyResponse);
  rpc Detail(RoleDetailRequest) returns(RoleDetailResponse);
  rpc UpdateStatus(RoleUpdateStatusRequest) returns(EmptyResponse);
  rpc All(RoleAllRequest) returns(RoleAllResponse);
}

// ================== role service end =================