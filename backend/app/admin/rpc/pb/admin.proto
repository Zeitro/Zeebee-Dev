  BaseTemplatePreviewRequestData data = 1;
}
message BaseTemplatePreviewRequestData {
  string content = 1;
  repeated TemplateVariableGroupEntity variable_group_schema = 2;
  string example_variables = 3;
  string name = 4;
}
// preview ---- response
message BaseTemplatePreviewResponse {
  BaseTemplatePreviewResponseData data = 1;
}
message BaseTemplatePreviewResponseData {
  string content = 1;
}


service BaseTemplate {
  rpc Create(CreateBaseTemplateRequest) returns(CreateBaseTemplateResponse);
  rpc Update(UpdateBaseTemplateRequest) returns(UpdateBaseTemplateResponse);
  rpc Detail(GetBaseTemplateRequest) returns(GetBaseTemplateResponse);
  rpc Page(BaseTemplatePageRequest) returns(BaseTemplatePageResponse);
  rpc SwitchStatus(SwitchBaseTemplateStatusRequest) returns(EmptyResponse);
  rpc Delete(DeleteBaseTemplateRequest) returns(EmptyResponse);
  rpc Preview(BaseTemplatePreviewRequest) returns(BaseTemplatePreviewResponse);
  rpc Reset(IdRequest) returns(EmptyResponse);
}
// ========================== base template service end =================

// ========================== loan service start =================
message LoanEntity {
  int64 id = 1;
  string stage = 2;
  string pending_status = 3;
  string loan_purpose = 4;
  string loan_type = 5;
  double total_amount = 6;
  double initial_amount = 7;
  LoanPropertyEntity loan_property = 8;
  string lender_company = 9;
  string closing_date = 10;
  double holdback_amount = 11;
  double holdback_released_amount = 12;
  float rate = 13;
  double closing_fund = 14;
  double principal_amount = 15;
  double monthly_payment = 16;
  string lien_position = 17;
  string maturity_date = 18;
  int32 prepayment_penalty = 19;
  string service_company = 20;
  string paid_off_date = 21;
  string created_at = 22;
  string updated_at = 23;
  int64 lender_organization_id = 24;
  int64 borrower_organization_id = 25;
  repeated string business_strategy = 26;
  repeated LoanApplicantEntity applicants = 27;
  string source = 28;
  int32 loan_term = 29;
  double ltv = 30;
  int32 est_credit_score = 31;
  double reserves_amount = 32;
  repeated LoanExperienceEntity transaction_experiences = 33;
  repeated LoanExperienceEntity real_estate_experiences = 34;
  LoanBorrowerEntity loan_borrower = 35;
  LoanDemographicEntity loan_demographic = 36;
  repeated LoanThirdServiceEntity loan_third_services = 37;
  string original_contract_date = 38;
  string extension_date = 39;
  string loan_processor = 40;
  LoanExtendValueEntity extend = 41;
  repeated LoanDocumentEntity loan_documents = 42;
  string code = 43;
}

message  LoanBudgetEntity {
  double original_budget = 1;
  double remaining_budget = 2;
  double cost_spent_to_date_amount = 3;
}

message LoanExtendValueEntity {
  string  pricing = 1;
  string loan_status_updates = 2;
  string meeting_notes = 3;
  string action_list = 4;
  string business_line = 5;
}

// loan page --- request
message LoanPageRequest {
  LoanPageRequestData data = 1;
}
// loan page --- response
message LoanPageResponse {
  LoanPageResponseData data = 1;
}

message  LoanPageRequestFilter {
  string stage = 2;
  string keyword = 3;
  string keyword_type = 4;
  repeated string loan_purpose = 5;
  repeated string loan_type = 6;
  repeated string pending_status = 7;
  repeated string lender = 8;
}

message  LoanPageRequestSorter {
  string column = 1;
  string sort = 2;
}

message LoanPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  LoanPageRequestFilter filter = 3;
  LoanPageRequestSorter sorter = 4;
}

message LoanPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated LoanEntity list = 5;
}

// detail ---- response
message LoanDetailResponse {
  LoanEntity data = 1;
}

// reassign --  request
message ReassignLoanRequest {
  ReassignLoanRequestData data = 1;
}
message ReassignLoanRequestData {
  int64 id = 1;
  int64 lender_organization_id = 2;
}

// loan lender companies ---- response
message LoanLenderCompaniesResponse {
  repeated string data = 1;
}


service Loan {
  rpc LoanPage(LoanPageRequest) returns(LoanPageResponse);
  rpc LoanDetail(IdRequest) returns(LoanDetailResponse);
  rpc ReassignLoan(ReassignLoanRequest) returns(EmptyResponse);
  rpc LoanLenderCompanies(EmptyRequest) returns(LoanLenderCompaniesResponse);
}

