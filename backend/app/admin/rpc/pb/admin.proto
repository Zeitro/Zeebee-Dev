syntax = "proto3";

package admin;

option go_package = "./admin";

message EmptyRequest {}

message EmptyResponse {}

message StringSliceResponse {
  repeated string data = 1;
}

message IdRequest {
  int64 data = 1;
}

message AddressEntity{
  string state = 1;
  string city = 2;
  string address1 = 3;
  string address2 = 4;
  string zip_code = 5;
}

message RangeInt64 {
  int64 min = 1;
  int64 max = 2;
}

message RangeInt32 {
  int32 min = 1;
  int32 max = 2;
}

message RangeFloat {
  double min = 1;
  double max = 2;
}

// ================= user service start ==================
message UserEntity {
  int64 id = 1;
  string email = 2;
  string status = 3;
  string type = 4;
  string first_name = 5;
  string mid_name = 6;
  string last_name = 7;
  string full_name = 8;
  int64 default_organization_id = 9;
  string created_at = 10;
  string updated_at = 11;
  string pivot_organization_status = 12;
  repeated RoleEntity roles = 13;
}

// login -- request
message UserLoginRequest {
  UserLoginRequestData data = 1;
}
message UserLoginRequestData {
  string email = 1;
  string password = 2;
}
// login -- response
message UserLoginResponse {
  UserLoginResponseData data = 1;
}
message UserLoginResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// refresh -- request
message RefreshTokenRequest {
  RefreshTokenRequestData data = 1;
}

message RefreshTokenRequestData {
  string refresh_token = 1;
}
// refresh -- response
message RefreshTokenResponse {
  RefreshTokenResponseData data = 1;
}

message RefreshTokenResponseData {
  string access_token = 1;
  int64 access_token_expire = 2;
}

// reset password -- request
message ResetPasswordRequest {
  ResetPasswordRequestData data = 1;
}
message ResetPasswordRequestData {
  string password = 1;
  string code = 2;
  string email = 3;
}
// reset password -- response
message ResetPasswordResponse {
  UserLoginResponseData data = 1;
}
message ResetPasswordResponseData {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expire = 3;
  int64 refresh_token_expire = 4;
}

// userinfo -- request
message UserInfoRequest {
  UserInfoRequestData data = 1;
}

message UserInfoRequestData {
  int64 id = 1;
}
// userinfo -- response
message UserinfoResponse {
  UserinfoResponseData data = 1;
}

message UserinfoResponseData {
  message Organization {
    int64 id = 1;
    string name = 2;
    string status = 3;
    bool is_default = 4;
  }

  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string full_name = 5;
  int64 organization_id = 6;
  string organization_name = 7;
  string status = 8;
  repeated Organization organizations = 9;
  bool is_owner = 10;
  bool is_admin = 11;
  int64 organization_user_id = 12;
}

// edit profile -- request
message UserProfileEditRequest {
  UserProfileEditRequestData data = 1;
}
message UserProfileEditRequestData {
  string first_name = 2;
  string last_name = 3;
  string phone = 4;
}
service User {
  // user
  rpc Login(UserLoginRequest) returns(UserLoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns(RefreshTokenResponse);
  rpc UserInfo(UserInfoRequest) returns(UserinfoResponse);
  rpc ResetPassword(ResetPasswordRequest) returns(ResetPasswordResponse);
  rpc EditProfile(UserProfileEditRequest) returns(UserinfoResponse);
}
// ================= user service end =================

// ================= organization user service start =================
message OrganizationUserEntity {
  int64 id = 1;
  int64 organization_id = 2;
  int64 user_id = 3;
  string status = 4;
  string first_name = 5;
  string mid_name = 6;
  string last_name = 7;
  string full_name = 8;
  string phone = 9;
  string remark = 10;
  string created_at = 11;
  string updated_at = 12;
  string email = 13;
  repeated RoleEntity roles = 14;
}

message OrganizationUserPageEntity {
  int64 id = 1;
  string status = 2;
  string first_name = 3;
  string mid_name = 4;
  string last_name = 5;
  string full_name = 6;
  string phone = 7;
  string remark = 8;
  string created_at = 9;
  string updated_at = 10;
  string email = 11;
  repeated RoleEntity roles = 12;
  bool is_owner = 13;
}
// page --  request
message OrganizationUserPageRequest {
  OrganizationUserPageRequestData data = 1;
}
message OrganizationUserPageRequestData {
  int64 page = 1;
  int64 limit = 2;
  OrganizationUserPageRequestFilter filter = 3;
  OrganizationUserPageRequestSorter sorter = 4;

}
message OrganizationUserPageRequestFilter {
  string keyword = 1;
}

message OrganizationUserPageRequestSorter {
  string column = 1;
  string sort = 2;
}
// page --  response
message OrganizationUserPageResponse {
  OrganizationUserPageResponseData data = 1;
}


message OrganizationUserPageResponseData {
  int64 page = 1;
  int64 limit = 2;
  int64 total = 3;
  int64 total_page = 4;
  repeated OrganizationUserPageEntity list = 5;
}
// create -- request
message OrganizationUserCreateRequest {
  OrganizationUserCreateRequestData data = 1;
}
message OrganizationUserCreateResponse {
  OrganizationUserEntity data = 1;
}
message OrganizationUserCreateRequestData {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  repeated int64 role_ids = 6;
}
// update -- request
message OrganizationUserUpdateRequest {
  OrganizationUserUpdateRequestData data = 1;
}
message OrganizationUserUpdateResponse {
  OrganizationUserEntity data = 1;
}
message OrganizationUserUpdateRequestData {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string phone = 5;
  repeated int64 role_ids = 6;
}
// delete -- request
message OrganizationUserDeleteRequest {
  OrganizationUserDeleteRequestData data = 1;
}

message OrganizationUserDeleteRequestData {
  int64 id = 1;
}

// detail -- request
message OrganizationUserDetailRequest {
  OrganizationUserDetailRequestData data = 1;
}
message OrganizationUserDetailResponse {
  OrganizationUserEntity data = 1;
}
message OrganizationUserDetailRequestData {
  int64 id = 1;
}
// switch status -- request
message OrganizationUserSwitchStatusRequest {
  OrganizationUserSwitchStatusRequestData data = 1;
}
message OrganizationUserSwitchStatusRequestData {
  int64 id = 1;
  string status = 4;
}

service OrganizationUser {
  rpc Page(OrganizationUserPageRequest) returns(OrganizationUserPageResponse);
  rpc Create(OrganizationUserCreateRequest) returns(OrganizationUserCreateResponse);
  rpc Update(OrganizationUserUpdateRequest) returns(OrganizationUserUpdateResponse);
  rpc Delete(OrganizationUserDeleteRequest) returns(EmptyResponse);
  rpc Detail(OrganizationUserDetailRequest) returns(OrganizationUserDetailResponse);
  rpc SwitchStatus(OrganizationUserSwitchStatusRequest) returns(EmptyResponse);
}
// ================== organization user service end =================

// ================= api service start =================
message ApiTreeEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  string path = 4;
  string method = 5;
  string status = 6;
  string description = 7;
  string type = 8;
  int32  sort_order = 9;
  string created_at = 10;
  string updated_at = 11;
  repeated ApiTreeEntity children = 12;
  bool auth_required = 13;
  bool permission_required = 14;
}

message ApiEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  string path = 4;
  string method = 5;
  string status = 6;
  string description = 7;
  string type = 8;
  int32  sort_order = 9;
  string created_at = 10;
  string updated_at = 11;
  bool auth_required = 13;
  bool permission_required = 14;
}

// api tree -- request
message ApiTreeRequest {
  ApiTreeRequestData data = 1;
}
message ApiTreeRequestData {
  int64 user_id = 1;
  int64 organization_id = 2;
  string type = 3;
}
// api tree -- response
message ApiTreeResponse {
  repeated ApiTreeEntity data = 1;
}
// create -- request
message ApiCreateRequest {
  ApiCreateRequestData data = 1;
}
message ApiCreateRequestData {
  int64 parent_id = 1;
  string type = 2;
  string name = 3;
  string path = 4;
  string method = 5;
  string description = 6;
  string status = 7;
  int32 sort_order = 8;
  bool auth_required = 9;
  bool permission_required = 10;
}

// update -- request
message ApiUpdateRequest {
  ApiUpdateRequestData data = 1;
}
message ApiUpdateRequestData {
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string name = 4;
  string path = 5;
  string method = 6;
  string description = 7;
  string status = 8;
  int32 sort_order = 9;
  bool auth_required = 10;
  bool permission_required = 11;
}

//  delete -- request
message ApiDeleteRequest {
  ApiDeleteRequestData data = 1;
}
message ApiDeleteRequestData {
  int64 id = 1;
  string type = 2;
}
// detail -- request
message ApiDetailRequest {
  ApiDetailRequestData data = 1;
}
message ApiDetailRequestData {
  int64 id = 1;
  string type = 2;
}

// detail -- response
message ApiDetailResponse {
  ApiEntity data = 1;
}

service api {
  rpc ApiTree(ApiTreeRequest) returns(ApiTreeResponse);
  rpc Create(ApiCreateRequest) returns(ApiDetailResponse);
  rpc Update(ApiUpdateRequest) returns(ApiDetailResponse);
  rpc Delete(ApiDeleteRequest) returns(EmptyResponse);
  rpc Detail(ApiDetailRequest) returns(ApiDetailResponse);
}
// =================== api service end =================

// ================= resource service start =================
message ResourceTreeEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string resource_type = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  string tag = 8;
  bool is_show = 9;
  string status = 10;
  int32  sort_order = 11;
  string created_at = 12;
  string updated_at = 13;
  repeated ResourceTreeEntity children = 14;
  bool enable_data_scope = 15;
}

message ResourceEntity{
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string resource_type = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  string tag = 8;
  bool is_show = 9;
  string status = 10;
  int32  sort_order = 11;
  string created_at = 12;
  string updated_at = 13;
  repeated ApiEntity apis = 14;
  string pivot_role_data_scope = 15;
  bool enable_data_scope = 16;
}

// resource tree -- request
message ResourceTreeRequest {
  ResourceTreeRequestData data = 1;
}
message ResourceTreeRequestData {
  string type = 1;
}
// resource tree -- response
message ResourceTreeResponse {
  repeated ResourceTreeEntity data = 1;
}
// create -- request
message ResourceCreateRequest {
  ResourceCreateRequestData data = 1;
}
message ResourceCreateRequestData {
  int64 parent_id = 1;
  string type = 2;
  string resource_type = 3;
  string name = 4;
  string path = 5;
  string icon = 6;
  string tag = 7;
  bool is_show = 8;
  string status = 9;
  int32 sort_order = 10;
  repeated int64 api_ids = 11;
  bool enable_data_scope = 12;
}

// update -- request
message ResourceUpdateRequest {
  ResourceUpdateRequestData data = 1;
}
message ResourceUpdateRequestData {
  int64 id = 1;
  int64 parent_id = 2;
  string type = 3;
  string resource_type = 4;
  string name = 5;
  string path = 6;
  string icon = 7;
  string tag = 8;
  bool is_show = 9;
  string status = 10;
  int32 sort_order = 11;
  repeated int64 api_ids = 12;
  bool enable_data_scope = 13;
}

//  delete -- request
message ResourceDeleteRequest {
  ResourceDeleteRequestData data = 1;
}
message ResourceDeleteRequestData {
  int64 id = 1;
  string type = 2;
}
// detail -- request
message ResourceDetailRequest {
  ResourceDetailRequestData data = 1;
}
message ResourceDetailRequestData {
  int64 id = 1;
  string type = 2;
}

message ResourceDetailResponse {
  ResourceEntity data = 1;
}


service resource {
  rpc ResourceTree(ResourceTreeRequest) returns(ResourceTreeResponse);
  rpc Create(ResourceCreateRequest) returns(ResourceDetailResponse);
  rpc Update(ResourceUpdateRequest) returns(ResourceDetailResponse);
  rpc Delete(ResourceDeleteRequest) returns(EmptyResponse);
  rpc Detail(ResourceDetailRequest) returns(ResourceDetailResponse);
}
// =================== resource service end =================
// ================= role service start =================
