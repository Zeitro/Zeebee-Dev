  string name = 2;
  string status = 3;
  AddressEntity address = 4;
  string contact_email = 5;
  string contact_phone = 6;
  string contact_name = 7;
  string owner_type = 8;
  string type = 9;
  string logo = 10;
  string website = 11;
  string tagline = 12;
  OrganizationMetadataEntity metadata = 13;
  string created_at = 14;
  string updated_at = 15;
  repeated OrganizationEmailEntity organization_emails = 16;
  UserEntity owner = 17;
}

message OrganizationPageEntity {
  int64 id = 1;
  string name = 2;
  string status = 3;
  string contact_email = 4;
  string contact_phone = 5;
  string contact_name = 6;
  string owner_type = 7;
  string type = 8;
  string logo = 9;
  string website = 10;
  string tagline = 11;
  string created_at = 12;
  string updated_at = 13;
  AddressEntity address = 14;
  string owner_email = 15;
  string owner_full_name = 16;
  string owner_first_name = 17;
