  ]
  ```

## 4. 数据转换契约

### Zeitro 字段 → Borrower 字段映射

  | Zeitro 字段 | Borrower 字段 | 数据类型 | 转换规则 |
  |------------|--------------|---------|---------|
  | FullAddress | full_address | string | TrimSpace |
  | State | state | string | TrimSpace |
  | County | county | string | TrimSpace |
  | City | city | string | TrimSpace |
  | ZipCode | zip_code | string | TrimSpace |
  | PropertyType | property_type | string | TrimSpace |
  | Price | price | string | TrimSpace |
  | IncomeIndicator | income_indicator | string | TrimSpace |
  | MinorityPercent | minority_percent | string | TrimSpace |
  | TotalPopulation | total_population | string | TrimSpace |
  | Hispanic | hispanic | string | TrimSpace |
  | Black | black | string | TrimSpace |
  | Asian | asian | string | TrimSpace |
  | Pacific | pacific | string | TrimSpace |
  | MsaCode | msa_code | string | TrimSpace |
  | DaysOnMarket | days_on_market | string | TrimSpace |
  | AgentName | agent_name | string | TrimSpace |
  | AgentPhone | agent_phone | string | 去除非数字字符 |
  | AgentEmail | agent_email | string | TrimSpace + 可选格式验证 |
  | Distance | distance | string | TrimSpace |

## 5. 错误代码契约

  | 错误代码 | HTTP 状态 | 描述 | 重试策略 |
  |---------|----------|------|---------|
  | CONFIG_INVALID | 500 | Zeitro 配置无效 | 不重试 |
  | AUTH_FAILED | 401 | Zeitro 认证失败 | 不重试 |
  | TOKEN_EXPIRED | 401 | Token 已过期 | 自动刷新后重试 |
  | CONNECTION_FAILED | 503 | 无法连接 Zeitro API | 指数退避重试 |
  | TIMEOUT | 503 | Zeitro API 超时 | 指数退避重试 |
  | RATE_LIMITED | 429 | 超过速率限制 | 延迟后重试 |
  | API_ERROR | 502 | Zeitro API 错误 | 根据错误类型决定 |
  | INVALID_INPUT | 400 | 请求参数无效 | 不重试 |

## 6. 性能契约

  | 指标 | 目标值 | 测量方法 |
  |------|--------|---------|
  | 平均响应时间 | < 2 秒 | 不包括 Zeitro API 时间 |
  | Token 缓存命中率 | > 95% | 缓存命中次数 / 总请求次数 |
  | Token 刷新成功率 | > 99.9% | 成功刷新次数 / 总刷新尝试 |
  | 并发处理能力 | ≥ 100 QPS | 负载测试 |
  | 超时时间 | 5 秒 | Zeitro API 调用超时 |

## 7. 安全契约

### 认证
- 使用 JWT Bearer Token 认证
- Token 由 borrower API Gateway 验证

### 授权
- 所有端点需要认证
- 使用 `Authority` 中间件

### 数据保护
- 不记录敏感信息（密码）
- 日志中不记录完整的 API 响应
- 错误消息不暴露内部细节

